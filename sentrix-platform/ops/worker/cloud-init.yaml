#cloud-config
# SentriX Hosting V1 worker bootstrap.
# Target: Ubuntu 24.04 LTS x86_64/arm64 with cgroups v2.
#
# Replace every __SENTRIX_*__ placeholder before provisioning. Never commit a
# real node token or a private repository credential into this file.

package_update: true
package_upgrade: false

write_files:
  - path: /etc/sentrix/node-agent.env
    owner: root:root
    permissions: "0600"
    content: |
      SENTRIX_CONTROL_PLANE_URL=__SENTRIX_CONTROL_PLANE_URL__
      SENTRIX_NODE_ID=__SENTRIX_NODE_ID__
      SENTRIX_NODE_TOKEN=__SENTRIX_NODE_TOKEN__
      SENTRIX_SANDBOX_RUNTIME=runsc
      SENTRIX_AGENT_CACHE=/var/lib/sentrix-agent/desired.json
      SENTRIX_AGENT_POLL_SECONDS=5
      SENTRIX_DOCKER_BIN=docker
      SENTRIX_EGRESS_SCRIPT=/opt/sentrix-platform/ops/execution/apply-egress-policy.sh
      SENTRIX_CONTROL_PLANE_CIDRS=__SENTRIX_CONTROL_PLANE_CIDRS__

  - path: /etc/sentrix/bootstrap.env
    owner: root:root
    permissions: "0600"
    content: |
      SENTRIX_REPO_URL=__SENTRIX_REPO_URL__
      SENTRIX_REPO_REF=__SENTRIX_REPO_REF__

  - path: /usr/local/sbin/sentrix-worker-bootstrap
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      source /etc/os-release
      if [[ "${ID:-}" != "ubuntu" ]]; then
        echo "SentriX worker bootstrap supports Ubuntu only" >&2
        exit 80
      fi
      case "${VERSION_ID:-}" in
        24.04|26.04) ;;
        *)
          echo "Unsupported Ubuntu version: ${VERSION_ID:-unknown}" >&2
          exit 81
          ;;
      esac

      source /etc/sentrix/bootstrap.env
      [[ -n "${SENTRIX_REPO_URL:-}" ]] || { echo "SENTRIX_REPO_URL missing" >&2; exit 82; }
      [[ -n "${SENTRIX_REPO_REF:-}" ]] || { echo "SENTRIX_REPO_REF missing" >&2; exit 83; }

      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates curl gnupg git iptables python3 python3-venv

      # Docker official APT repository. Avoid curl|sh so package provenance is
      # explicit and future upgrades stay under apt control.
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      cat >/etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
      Components: stable
      Architectures: $(dpkg --print-architecture)
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF

      # gVisor official APT repository. The Debian package is the preferred
      # installation path and keeps the multi-file runsc distribution intact.
      curl -fsSL https://gvisor.dev/archive.key \
        | gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
      printf '%s\n' \
        "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
        >/etc/apt/sources.list.d/gvisor.list

      apt-get update
      apt-get install -y --no-install-recommends \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin runsc
      systemctl enable --now docker

      # Installing from the gVisor APT repository normally configures Docker,
      # but runsc install is idempotent and makes the required runtime explicit.
      runsc install
      systemctl restart docker
      docker info --format '{{json .Runtimes}}' | grep -q 'runsc'
      docker run --rm --runtime=runsc hello-world >/var/log/sentrix-runsc-smoke.log

      install -d -m 0755 /opt/sentrix-source
      if [[ -d /opt/sentrix-source/.git ]]; then
        git -C /opt/sentrix-source fetch --depth 1 origin "${SENTRIX_REPO_REF}"
        git -C /opt/sentrix-source checkout --detach FETCH_HEAD
      else
        rm -rf /opt/sentrix-source
        git clone --depth 1 --branch "${SENTRIX_REPO_REF}" \
          "${SENTRIX_REPO_URL}" /opt/sentrix-source
      fi

      test -f /opt/sentrix-source/sentrix-platform/pyproject.toml
      ln -sfn /opt/sentrix-source/sentrix-platform /opt/sentrix-platform
      chmod +x /opt/sentrix-platform/ops/worker/preflight.sh
      chmod +x /opt/sentrix-platform/ops/execution/apply-egress-policy.sh

      python3 -m venv /opt/sentrix-platform/.venv
      /opt/sentrix-platform/.venv/bin/python -m pip install --upgrade pip
      /opt/sentrix-platform/.venv/bin/pip install -e /opt/sentrix-platform

      install -m 0644 \
        /opt/sentrix-platform/ops/worker/sentrix-node-agent.service \
        /etc/systemd/system/sentrix-node-agent.service
      install -d -m 0700 /var/lib/sentrix-agent

      set -a
      source /etc/sentrix/node-agent.env
      set +a
      /opt/sentrix-platform/ops/worker/preflight.sh

      systemctl daemon-reload
      systemctl enable --now sentrix-node-agent.service
      systemctl --no-pager --full status sentrix-node-agent.service

      # The bootstrap repository location may contain credentials in its URL.
      # Keep its config root-only; never print it into cloud-init logs.
      chmod 0700 /opt/sentrix-source
      echo "SentriX worker bootstrap complete"

runcmd:
  - [bash, -lc, "/usr/local/sbin/sentrix-worker-bootstrap"]

final_message: "SentriX Hosting worker provisioning finished. Inspect sentrix-node-agent.service before admitting workloads."
