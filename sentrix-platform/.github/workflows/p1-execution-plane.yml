name: SentriX Platform P1 Execution Plane

on:
  push:
    branches: [main]
    paths:
      - "sentrix-platform/**"
      - ".github/workflows/p1-execution-plane.yml"
  pull_request:
    paths:
      - "sentrix-platform/**"
      - ".github/workflows/p1-execution-plane.yml"
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentrix
    defaults:
      run:
        working-directory: sentrix-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration tests/security -v --tb=short
      - run: ruff check . && ruff format --check .
      - run: mypy libs services agents

  host-isolation-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentrix-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Install gVisor runsc
        run: sudo ./ops/execution/install-gvisor.sh
      - name: Verify cgroups v2
        run: test -f /sys/fs/cgroup/cgroup.controllers
      - name: Chaos gate - kill -9 + CP outage
        run: sudo -E env PATH="$PATH" PYTHONPATH="$PWD" ./ops/ci/p1-chaos.sh
      - name: Isolation gate - public vs private/metadata/cross-tenant
        run: sudo -E env PATH="$PATH" PYTHONPATH="$PWD" ./ops/ci/p1-isolation.sh
