name: SentriX Stability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DISCORD_TOKEN: "ci.fake.token"
      DATABASE_PATH: "/tmp/sentrix-stability.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Compile active Python sources
        run: python -m compileall -q main.py config.py railway_boot.py railway_canary_boot.py cogs database utils web tools tests

      - name: Static repository audit
        run: python tools/repo_audit.py

      - name: Current core regression suite
        run: python -m unittest tests.test_final_core_contract tests.test_easy_surface_contract -v

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Help premium style audit
        run: python tools/help_clean_style_audit.py

      - name: Slash success and error lifecycle
        run: |
          python tools/slash_thinking_gate.py
          python tools/slash_error_lifecycle_gate.py
          python tools/defer_send_audit.py

      - name: AI compatibility contract
        run: python tools/ai_api_hotfix_gate.py

      - name: Economy concurrency invariant
        run: python tools/load_test_economy.py --users 60 --operations 800 --concurrency 20

      - name: Dashboard security interaction audit
        run: python tools/web_interaction_audit.py

      - name: Stability result
        run: echo "SentriX canonical stability checks passed for $GITHUB_SHA"
