name: SentriX Mini Log Profiles

on:
  pull_request:
    paths:
      - "utils/log_sender_profiles.py"
      - "utils/log_service.py"
      - "utils/wide_logs.py"
      - "web/dashboard_api_logs.py"
      - "web/dashboard_ui/js/37_logs.js"
      - "tests/test_log_sender_profiles.py"
      - ".github/workflows/mini-log-profiles.yml"
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - "utils/log_sender_profiles.py"
      - "utils/log_service.py"
      - "utils/wide_logs.py"
      - "web/dashboard_api_logs.py"
      - "web/dashboard_ui/js/37_logs.js"
      - "tests/test_log_sender_profiles.py"
jobs:
  mini-profile-tests:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile affected Python modules
        run: python -m py_compile utils/log_sender_profiles.py utils/log_service.py utils/wide_logs.py web/dashboard_api_logs.py
      - name: Validate dashboard JavaScript
        run: node --check web/dashboard_ui/js/37_logs.js
      - name: Test mini-profiles and log transport
        run: python -m pytest tests/test_log_sender_profiles.py tests/test_logs_routage.py tests/test_premium_log_center.py -q
