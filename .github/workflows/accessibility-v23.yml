name: SentriX V2.3 Accessibility

on:
  push:
    branches: [main]
    paths:
      - 'utils/accessibility.py'
      - 'cogs/sentrix_accessibility.py'
      - 'web/dashboard_accessibility.py'
      - 'cogs/final_runtime_polish.py'
      - 'tests/test_accessibility.py'
      - 'tools/accessibility_v23_gate.py'
      - '.github/workflows/accessibility-v23.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Discord runtime
        run: python -m pip install 'discord.py>=2.6.3,<3.0'
      - name: Compile accessibility sources
        run: python -m compileall -q utils/accessibility.py cogs/sentrix_accessibility.py web/dashboard_accessibility.py cogs/final_runtime_polish.py tools/accessibility_v23_gate.py
      - name: Pure accessibility tests
        run: python -m unittest tests.test_accessibility
      - name: Accessibility regression gate
        run: python tools/accessibility_v23_gate.py
