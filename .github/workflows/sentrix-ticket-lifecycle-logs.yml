name: SentriX Ticket Lifecycle Logs

on:
  pull_request:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'services/ticket_log_report.py'
      - 'cogs/ticket_claim_security.py'
      - 'utils/wide_logs.py'
      - 'tests/test_ticket_log_report_v1.py'
      - '.github/workflows/sentrix-ticket-lifecycle-logs.yml'
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'services/ticket_log_report.py'
      - 'cogs/ticket_claim_security.py'
      - 'utils/wide_logs.py'
      - 'tests/test_ticket_log_report_v1.py'
      - '.github/workflows/sentrix-ticket-lifecycle-logs.yml'

jobs:
  ticket-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
      - name: Verify syntax
        run: python -m py_compile services/ticket_log_report.py cogs/ticket_claim_security.py utils/wide_logs.py
      - name: Test ticket lifecycle summaries and existing controls
        run: |
          python -m pytest -q \
            tests/test_ticket_log_report_v1.py \
            tests/test_ticket_journalisation.py \
            tests/test_ticket_claim_security_safe_log.py \
            tests/test_ticket_controls_compact_and_log_quality.py \
            tests/test_ticket_fermer_nest_pas_supprimer.py \
            tests/test_ticket_events_registry.py \
            tests/test_services_tickets.py \
            tests/test_ticket_atomic_actions.py \
            tests/test_fermeture_ticket_masque.py
