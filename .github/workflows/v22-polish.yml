name: SentriX V2.2 Polish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile V2.2 sources
        run: python -m compileall -q utils/v22_rules.py utils/stats_service.py cogs/sentrix_v22.py cogs/final_runtime_polish.py web/dashboard_v2_home.py tools/v22_quality_gate.py tests

      - name: Pure V2.2 unit tests
        run: python -m unittest discover -s tests -p 'test_v22_rules.py' -v

      - name: V2.2 no-new-command quality gate
        run: python tools/v22_quality_gate.py

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Command registry audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-commands.db"
        run: python tools/command_runtime_audit.py

      - name: Permission matrix audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-permissions.db"
        run: python tools/permission_guard_audit.py

      - name: Security runtime audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-security.db"
        run: python tools/security_runtime_audit.py

      - name: Multi-instance isolation audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
        run: python tools/instance_isolation_audit.py

      - name: Dashboard interaction audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-dashboard.db"
        run: python tools/web_interaction_audit.py
