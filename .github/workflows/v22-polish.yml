name: SentriX V2.2 Polish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile V2.2 sources
        run: python -m compileall -q utils/v22_rules.py utils/stats_service.py cogs/sentrix_v22.py cogs/final_runtime_polish.py web/dashboard_v2_home.py tools/v22_quality_gate.py tests

      - name: Pure V2.2 unit tests
        run: python -m unittest discover -s tests -p 'test_v22_rules.py' -v

      - name: V2.2 no-new-command quality gate
        run: python tools/v22_quality_gate.py

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Targeted slash, staff and notification permissions regression tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-targeted-regression.db"
        run: |
          python -m pytest -q \
            tests/test_staff_audit_collision.py \
            tests/test_v95_greedy_annotation.py \
            tests/test_v110_intermediate_budget.py \
            tests/test_command_runtime_root_filter.py \
            tests/test_notification_command_permissions.py

      - name: Visible dashboard logs UI contracts and JS syntax
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-visible-logs-ui.db"
        run: |
          python -m pytest -q tests/test_dashboard_logs_visible_v1.py tests/test_dashboard_unified_v2.py
          node --check web/dashboard_ui/js/37_logs.js

      - name: SQLite pre-import isolation regressions
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-db-isolation.db"
        run: >-
          python -m pytest -q tests/test_runtime_hygiene_gates.py
          -k "test_chaque_audit_utilise_une_base_temporaire_distincte or test_sitecustomize_honore_database_path_defini_avant_demarrage"

      - name: Command registry audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-commands.db"
        run: python tools/command_runtime_audit.py

      - name: Command callback integrity audit (slash/prefix divergence)
        env:
          DISCORD_TOKEN: "ci.fake.token"
        run: python tools/command_callback_integrity_audit.py

      - name: Permission matrix audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-permissions.db"
        run: python tools/permission_guard_audit.py

      - name: Command permission group consistency audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
        run: python tools/command_permission_group_consistency_audit.py

      - name: Security runtime audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-security.db"
        run: python tools/security_runtime_audit.py

      - name: Multi-instance isolation audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
        run: python tools/instance_isolation_audit.py

      - name: Dashboard interaction audit
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v22-dashboard.db"
        run: python tools/web_interaction_audit.py
