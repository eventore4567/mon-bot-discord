name: Railway HA staggered deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: railway-ha-staggered-deploy
  cancel-in-progress: true

jobs:
  sync-standby-after-primary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIMARY_HEALTH_URL: https://mon-bot-discord-production-8944.up.railway.app/health
      PRIMARY_RAILWAY_CONTEXT: selfless-tenderness - mon-bot-discord

    steps:
      - name: Wait for Railway to deploy this exact main commit
        uses: actions/github-script@v7
        with:
          script: |
            const expectedContext = process.env.PRIMARY_RAILWAY_CONTEXT;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            let validated = false;

            core.info(`Waiting for Railway PRIMARY status on ${context.sha}...`);

            for (let attempt = 1; attempt <= 180; attempt++) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });

              const primary = statuses.find(status => status.context === expectedContext);

              if (!primary) {
                core.info(`Railway PRIMARY status not published yet (${attempt}/180).`);
                await sleep(5000);
                continue;
              }

              core.info(`Railway PRIMARY status: ${primary.state} (${attempt}/180).`);

              if (primary.state === 'success') {
                validated = true;
                break;
              }

              if (primary.state === 'failure' || primary.state === 'error') {
                core.setFailed(`Railway PRIMARY deployment failed for ${context.sha}. standby-stable stays untouched.`);
                return;
              }

              await sleep(5000);
            }

            if (!validated) {
              core.setFailed(`Railway PRIMARY never reached success for ${context.sha}. standby-stable stays untouched.`);
              return;
            }

            core.notice(`Railway PRIMARY validated for exact commit ${context.sha}.`);

      - name: Verify PRIMARY HTTP liveness
        shell: bash
        run: |
          set -euo pipefail
          ready=0

          for attempt in $(seq 1 30); do
            status="$(curl --connect-timeout 4 --max-time 8 -sS -o /tmp/sentrix-health.json -w '%{http_code}' "$PRIMARY_HEALTH_URL" || true)"
            if [[ "$status" == "200" ]]; then
              echo "PRIMARY health endpoint is reachable (HTTP 200)."
              ready=1
              break
            fi
            echo "PRIMARY health endpoint not ready yet (HTTP ${status:-none}, ${attempt}/30)."
            sleep 3
          done

          if [[ "$ready" != "1" ]]; then
            echo "::error::Railway marked the PRIMARY successful, but its health endpoint is unreachable. standby-stable will NOT be moved."
            exit 1
          fi

      - name: Soak PRIMARY before restarting standby
        shell: bash
        run: |
          set -euo pipefail
          echo "PRIMARY is deployed. Waiting 30 seconds before touching standby-stable..."
          sleep 30
          status="$(curl --connect-timeout 4 --max-time 8 -sS -o /tmp/sentrix-health-after-soak.json -w '%{http_code}' "$PRIMARY_HEALTH_URL" || true)"
          if [[ "$status" != "200" ]]; then
            echo "::error::PRIMARY failed the 30-second liveness recheck (HTTP ${status:-none}). standby-stable stays untouched."
            exit 1
          fi
          echo "PRIMARY survived the soak period."

      - name: Move standby-stable to the validated main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/standby-stable',
            });

            if (ref.object.sha === context.sha) {
              core.notice(`standby-stable is already on ${context.sha}; nothing to do.`);
              return;
            }

            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/standby-stable',
              sha: context.sha,
              force: true,
            });
            core.notice(`standby-stable moved to ${context.sha}.`);

      - name: Deployment summary
        run: |
          echo "PRIMARY Railway deployment for ${GITHUB_SHA} was validated first."
          echo "PRIMARY remained reachable during the 30-second soak."
          echo "standby-stable now follows the validated main commit."
          echo "Railway may redeploy only the standby while the PRIMARY remains available."
