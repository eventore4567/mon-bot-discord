name: Railway HA staggered deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-ha-staggered-deploy
  cancel-in-progress: true

jobs:
  sync-standby-after-primary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIMARY_HEALTH_URL: https://mon-bot-discord-production-8944.up.railway.app/health

    steps:
      - name: Wait for the new primary deployment
        shell: bash
        run: |
          set -euo pipefail

          target_sha="${GITHUB_SHA:0:12}"
          saw_down=0
          ready=0

          echo "Waiting for Railway primary deployment ${target_sha}..."

          for attempt in $(seq 1 180); do
            body="$(curl --connect-timeout 4 --max-time 8 -fsS "$PRIMARY_HEALTH_URL" 2>/dev/null || true)"

            if [[ -z "$body" ]]; then
              saw_down=1
              echo "Primary temporarily unavailable (${attempt}/180), rollout in progress..."
              sleep 5
              continue
            fi

            parsed="$(BODY="$body" python3 - <<'PY'
import json
import os

try:
    data = json.loads(os.environ.get("BODY", "{}"))
except Exception:
    print("false|")
    raise SystemExit(0)

ok = bool(data.get("ok"))
release = str(data.get("release") or data.get("railway_release") or "").strip()[:12]
print(("true" if ok else "false") + "|" + release)
PY
)"

            ok="${parsed%%|*}"
            release="${parsed#*|}"

            # Best case: the health endpoint exposes the Railway commit currently running.
            if [[ "$ok" == "true" && -n "$release" && "$release" == "$target_sha" ]]; then
              echo "Primary is healthy on the expected release ${release}."
              ready=1
              break
            fi

            # Compatibility path for older health payloads without a release field:
            # only accept recovery after we have actually observed the primary go away.
            if [[ "$ok" == "true" && -z "$release" && "$saw_down" == "1" ]]; then
              echo "Primary recovered after the Railway rollout."
              ready=1
              break
            fi

            if [[ -n "$release" ]]; then
              echo "Primary healthy but still on ${release}; waiting for ${target_sha}..."
            else
              echo "Primary reachable; waiting for proof that the rollout completed..."
            fi
            sleep 5
          done

          if [[ "$ready" != "1" ]]; then
            echo "::error::Primary never proved healthy on the new deployment. standby-stable will NOT be moved."
            exit 1
          fi

          # Short soak period: a process that only survives a few seconds must not cause
          # the standby to be restarted underneath it.
          echo "Primary detected. Soaking for 30 seconds before touching the standby..."
          sleep 30

          body="$(curl --connect-timeout 4 --max-time 8 -fsS "$PRIMARY_HEALTH_URL")"
          parsed="$(BODY="$body" python3 - <<'PY'
import json
import os

data = json.loads(os.environ.get("BODY", "{}"))
ok = bool(data.get("ok"))
release = str(data.get("release") or data.get("railway_release") or "").strip()[:12]
print(("true" if ok else "false") + "|" + release)
PY
)"
          ok="${parsed%%|*}"
          release="${parsed#*|}"

          if [[ "$ok" != "true" ]]; then
            echo "::error::Primary failed the 30-second soak health recheck. standby-stable stays untouched."
            exit 1
          fi

          if [[ -n "$release" && "$release" != "$target_sha" ]]; then
            echo "::error::Primary release changed during soak (${release} != ${target_sha}). A newer rollout may be running."
            exit 1
          fi

      - name: Move standby-stable to the validated main commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/standby-stable',
              sha: context.sha,
              force: true,
            });
            core.notice(`standby-stable moved to ${context.sha}`);

      - name: Deployment summary
        run: |
          echo "Primary validated first."
          echo "standby-stable now points to ${GITHUB_SHA}."
          echo "Railway may now redeploy only the standby while the primary remains available."
