name: SentriX Surveillance Dossier Gate

on:
  pull_request:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'cogs/log_history_center.py'
      - 'cogs/voice_history_config.py'
      - 'cogs/setup_control_center.py'
      - 'sentrix_v103_setup_fix.py'
      - 'tests/test_member_history_readability.py'
      - 'tests/test_config_center_level_opt_in.py'
      - 'tests/test_slash_schema_guard_v105.py'
      - 'tests/test_member_voice_history_v4.py'
      - '.github/workflows/sentrix-surveillance-dossier-gate.yml'
  workflow_dispatch:

jobs:
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DISCORD_TOKEN: ci.fake.token
      DATABASE_PATH: /tmp/sentrix-surveillance-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile updated screens
        run: python -m py_compile cogs/log_history_center.py cogs/voice_history_config.py cogs/setup_control_center.py sentrix_v103_setup_fix.py
      - name: Test profile identity, discrete cards and slash routes
        run: |
          python -m pytest -q \
            tests/test_member_history_readability.py \
            tests/test_member_voice_history_v4.py \
            tests/test_slash_schema_guard_v105.py \
            tests/test_config_center_level_opt_in.py \
            tests/test_report_and_warning_centers.py \
            tests/test_setup_v114_authority.py
