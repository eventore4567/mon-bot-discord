name: Dashboard V55 smoke

on:
  push:
    branches:
      - fix/dashboard-v55-stable-frontend

jobs:
  dashboard-v55:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest aiohttp
      - name: Run V55 regression tests
        run: python -m pytest -q tests/test_dashboard_frontend_freeze_v55.py
