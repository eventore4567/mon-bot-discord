name: SentriX Platform One-shot Autofix

on:
  push:
    branches:
      - chatgpt/platform-v1-full
    paths:
      - '.github/workflows/platform-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentrix-platform-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        working-directory: sentrix-platform
        run: pip install -e '.[dev]'
      - name: Canonical Ruff formatting and automatic fixes
        working-directory: sentrix-platform
        run: |
          ruff format .
          ruff check . --fix --unsafe-fixes || true
          ruff format .
      - name: Commit canonical formatting
        run: |
          rm -f .github/workflows/platform-autofix.yml
          git config user.name 'sentrix-platform-bot'
          git config user.email 'sentrix-platform-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Platform V1: canonical Ruff formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
