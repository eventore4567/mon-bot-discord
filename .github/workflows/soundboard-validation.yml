name: Soundboard validation

on:
  pull_request:
    paths:
      - 'cogs/soundboard_logs.py'
      - 'utils/log_categories.py'
      - 'utils/log_service.py'
      - 'tests/test_soundboard_logs.py'
      - 'requirements.txt'
      - '.github/workflows/soundboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soundboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Soundboard modules
        run: |
          python -m py_compile cogs/soundboard_logs.py utils/log_categories.py utils/log_service.py tests/test_soundboard_logs.py

      - name: Run Soundboard tests
        env:
          DISCORD_TOKEN: x
        run: python -m pytest -q tests/test_soundboard_logs.py
