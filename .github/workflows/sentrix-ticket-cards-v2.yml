name: SentriX Ticket Cards V2

on:
  pull_request:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'utils/wide_logs.py'
      - 'tests/test_ticket_log_cards_premium_v2.py'
      - '.github/workflows/sentrix-ticket-cards-v2.yml'
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'utils/wide_logs.py'
      - 'tests/test_ticket_log_cards_premium_v2.py'
      - '.github/workflows/sentrix-ticket-cards-v2.yml'

jobs:
  ticket-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
      - name: Validate Components V2 syntax
        run: python -m py_compile utils/wide_logs.py
      - name: Test ticket card layout and existing attachments
        run: |
          python -m pytest -q \
            tests/test_ticket_log_cards_premium_v2.py \
            tests/test_ticket_log_report_v1.py \
            tests/test_ticket_controls_compact_and_log_quality.py \
            tests/test_message_log_transcripts.py \
            tests/test_ticket_journalisation.py \
            tests/test_ticket_events_registry.py \
            tests/test_ticket_claim_security_safe_log.py \
            tests/test_ticket_fermer_nest_pas_supprimer.py
