name: SentriX Ticket HTML Transcripts

on:
  pull_request:
    paths:
      - "services/ticket_transcript_html.py"
      - "services/ticket_transcript_links.py"
      - "web/ticket_transcript_viewer.py"
      - "web/dashboard_recovery_v54.py"
      - "tests/test_ticket_transcript_web.py"
      - "cogs/tickets.py"
      - "cogs/ticket_claim_security.py"
      - "tests/test_ticket_transcript_html.py"
      - ".github/workflows/ticket-html-transcripts.yml"
  push:
    branches:
      - dashboard-refonte-2026-09
    paths:
      - "services/ticket_transcript_html.py"
      - "services/ticket_transcript_links.py"
      - "web/ticket_transcript_viewer.py"
      - "web/dashboard_recovery_v54.py"
      - "tests/test_ticket_transcript_web.py"
      - "cogs/tickets.py"
      - "cogs/ticket_claim_security.py"
      - "tests/test_ticket_transcript_html.py"

jobs:
  transcript-html:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m py_compile services/ticket_transcript_html.py services/ticket_transcript_links.py web/ticket_transcript_viewer.py cogs/tickets.py cogs/ticket_claim_security.py
      - name: Test safe HTML and closure DMs
        run: python -m pytest tests/test_ticket_transcript_html.py tests/test_ticket_transcript_web.py -q
