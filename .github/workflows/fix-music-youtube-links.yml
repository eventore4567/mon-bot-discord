name: Fix music YouTube links

on:
  push:
    branches:
      - fix/v98-grouped-slash
    paths:
      - .github/workflows/fix-music-youtube-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v98-grouped-slash
          fetch-depth: 0

      - name: Patch music extractor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("cogs/music.py")
          text = path.read_text(encoding="utf-8")

          old_imports = "import asyncio\nimport discord\n"
          new_imports = "import asyncio\nimport logging\nfrom urllib.parse import urlparse\n\nimport discord\n"
          if old_imports not in text:
              raise SystemExit("music.py imports marker not found")
          text = text.replace(old_imports, new_imports, 1)

          old_panels = "from utils import sentrix_panels as panels\n\nFFMPEG_OPTIONS = {"
          new_panels = "from utils import sentrix_panels as panels\n\nlogger = logging.getLogger(\"bot.music\")\n\nFFMPEG_OPTIONS = {"
          if old_panels not in text:
              raise SystemExit("music.py logger marker not found")
          text = text.replace(old_panels, new_panels, 1)

          old_opts = '''YTDL_OPTIONS = {
              "format": "bestaudio/best",
              "noplaylist": True,
              "quiet": True,
              "default_search": "ytsearch",
              "source_address": "0.0.0.0",
          }


          class GuildMusicState:'''
          new_opts = '''YTDL_OPTIONS = {
              "format": "bestaudio[acodec!=none]/bestaudio/best",
              "noplaylist": True,
              "quiet": True,
              "default_search": "ytsearch",
              "source_address": "0.0.0.0",
              "socket_timeout": 20,
              "retries": 3,
              "extractor_retries": 3,
              "fragment_retries": 3,
          }


          def _normalise_music_query(query: str) -> str:
              value = (query or "").strip()
              # Discord peut entourer un lien de <...> pour masquer l'aperçu.
              if len(value) >= 2 and value.startswith("<") and value.endswith(">"):
                  value = value[1:-1].strip()
              return value


          def _is_youtube_url(query: str) -> bool:
              try:
                  parsed = urlparse(query)
              except Exception:
                  return False
              host = (parsed.hostname or "").lower()
              return host in {"youtu.be", "youtube.com", "www.youtube.com", "music.youtube.com", "m.youtube.com"} or host.endswith(".youtube.com")


          class GuildMusicState:'''
          if old_opts not in text:
              raise SystemExit("music.py yt-dlp options marker not found")
          text = text.replace(old_opts, new_opts, 1)

          old_extract = '''    async def ytdl_extract(self, query: str) -> dict:
              import yt_dlp
              loop = asyncio.get_event_loop()
              with yt_dlp.YoutubeDL(YTDL_OPTIONS) as ydl:
                  info = await loop.run_in_executor(None, lambda: ydl.extract_info(query, download=False))
              if "entries" in info:
                  info = info["entries"][0]
              return {
                  "title": info.get("title", "Titre inconnu"),
                  "url": info["url"],
                  "webpage_url": info.get("webpage_url", ""),
                  "thumbnail": info.get("thumbnail", ""),
                  "duration": info.get("duration", 0),
              }
'''
          new_extract = '''    async def _extract_info(self, query: str, options: dict) -> dict:
              import yt_dlp

              loop = asyncio.get_running_loop()

              def extract():
                  with yt_dlp.YoutubeDL(options) as ydl:
                      return ydl.extract_info(query, download=False)

              return await loop.run_in_executor(None, extract)

              
          async def ytdl_extract(self, query: str) -> dict:
              import yt_dlp

              query = _normalise_music_query(query)
              if not query:
                  raise ValueError("recherche vide")

              try:
                  info = await self._extract_info(query, dict(YTDL_OPTIONS))
              except yt_dlp.utils.DownloadError as exc:
                  message = str(exc).lower()
                  # Les IP de datacenter sont parfois bloquées par YouTube. Le client
                  # web_embedded ne demande pas de PO token pour les vidéos intégrables
                  # et constitue un second chemin propre avant d'abandonner.
                  if _is_youtube_url(query) and ("not a bot" in message or "sign in to confirm" in message or "login_required" in message):
                      fallback = dict(YTDL_OPTIONS)
                      fallback["extractor_args"] = {
                          "youtube": {"player_client": ["web_embedded", "android_vr"]}
                      }
                      info = await self._extract_info(query, fallback)
                  else:
                      raise

              if not info:
                  raise ValueError("aucun résultat")
              if "entries" in info:
                  entries = [entry for entry in (info.get("entries") or []) if entry]
                  if not entries:
                      raise ValueError("aucun résultat exploitable")
                  info = entries[0]
              stream_url = info.get("url")
              if not stream_url:
                  raise ValueError("aucun flux audio disponible")
              return {
                  "title": info.get("title", "Titre inconnu"),
                  "url": stream_url,
                  "webpage_url": info.get("webpage_url", ""),
                  "thumbnail": info.get("thumbnail", ""),
                  "duration": info.get("duration", 0),
                  "uploader": info.get("uploader", ""),
              }
'''
          if old_extract not in text:
              raise SystemExit("music.py extractor marker not found")
          text = text.replace(old_extract, new_extract, 1)

          old_except = '''        try:
              track = await self.ytdl_extract(recherche)
          except Exception:
              return await panels.envoyer(ctx, panels.depuis_embed(await self._embed(ctx.guild.id, title='Lecture impossible', description='Impossible de trouver ou lire cette musique.', kind='danger')))
'''
          new_except = '''        try:
              track = await self.ytdl_extract(recherche)
          except Exception as exc:
              message = str(exc).lower()
              logger.warning(
                  "Extraction musique impossible source=%s erreur=%s",
                  (urlparse(_normalise_music_query(recherche)).hostname or "recherche") if "://" in _normalise_music_query(recherche) else "recherche",
                  exc,
              )
              if "not a bot" in message or "sign in to confirm" in message or "login_required" in message:
                  description = "YouTube bloque actuellement ce lien depuis le serveur. Essaie le titre de la musique sans le lien ; SentriX tentera la recherche automatiquement."
              else:
                  description = "Impossible de trouver ou lire cette musique. Vérifie le lien ou essaie avec le titre."
              return await panels.envoyer(ctx, panels.depuis_embed(await self._embed(ctx.guild.id, title='Lecture impossible', description=description, kind='danger')))
'''
          if old_except not in text:
              raise SystemExit("music.py play error marker not found")
          text = text.replace(old_except, new_except, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python
        run: |
          python -m py_compile cogs/music.py
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-music-youtube-links.yml
          git add cogs/music.py .github/workflows/fix-music-youtube-links.yml
          git commit -m "fix(music): recover YouTube links on hosted runtime"
          git push origin HEAD:fix/v98-grouped-slash
