name: SentriX Synthetic E2E and Resilience

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile E2E gate
        run: python -m py_compile tools/real_e2e_resilience_audit.py

      - name: Synthetic E2E and resilience gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-real-e2e.db"
          OPENAI_API_KEY: ""
          POSTGRES_URL: ""
          REDIS_URL: ""
        run: python tools/real_e2e_resilience_audit.py
