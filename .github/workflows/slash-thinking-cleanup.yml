name: SentriX Slash Completion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slash-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile slash completion sources
        run: python -m compileall -q cogs/__init__.py cogs/interaction_transport_guard.py cogs/stale_discord_app_detector.py cogs/slash_reliability_v7.py web/dashboard_instance_runtime.py web/production_health.py tools/interaction_transport_gate.py tools/stale_discord_app_gate.py tools/slash_thinking_gate.py
      - name: Interaction transport regression gate
        run: python tools/interaction_transport_gate.py
      - name: Stale Discord app detector gate
        run: python tools/stale_discord_app_gate.py
      - name: Slash thinking regression gate
        run: python tools/slash_thinking_gate.py
