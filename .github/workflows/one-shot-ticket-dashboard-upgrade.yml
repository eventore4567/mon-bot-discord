          import json
          from types import SimpleNamespace

          from cogs import tickets


          class FakeDB:
              def __init__(self, payload=None):
                  self.payload = payload or {}
                  self.writes = []

              async def fetchone(self, query, args=()):
                  if "ticket_button_settings" in query:
                      return {"config_json": json.dumps(self.payload)} if self.payload else None
                  return None

              async def execute(self, query, args=()):
                  self.writes.append((query, args))
                  if "ticket_button_settings" in query:
                      self.payload = json.loads(args[1])
                  return SimpleNamespace(lastrowid=1)


          def run(coro):
              return asyncio.run(coro)


          def test_panel_roles_are_normalised_deduplicated_and_isolated_per_panel():
              db = FakeDB()
              bot = SimpleNamespace(db=db)
              run(tickets.save_panel_role_settings(bot, 10, 21, "access", [5, 5, 6, "7", -1]))
              run(tickets.save_panel_role_settings(bot, 10, 21, "ping", [8, 9]))
              run(tickets.save_panel_role_settings(bot, 10, 22, "access", [99]))
              assert run(tickets.get_panel_role_settings(bot, 10, 21)) == {
                  "access": [5, 6, 7],
                  "ping": [8, 9],
              }
              assert run(tickets.get_panel_role_settings(bot, 10, 22)) == {
                  "access": [99],
                  "ping": [],
              }


          def test_staff_button_save_preserves_panel_role_metadata():
              payload = {
                  tickets.PANEL_ROLE_META_KEY: {"7": {"access": [111], "ping": [222]}},
              }
              db = FakeDB(payload)
              bot = SimpleNamespace(db=db)
              settings = tickets.default_button_settings()
              settings["claim"]["label"] = "Je prends"
              run(tickets.save_button_settings(bot, 42, settings))
              assert db.payload[tickets.PANEL_ROLE_META_KEY]["7"] == {
                  "access": [111],
                  "ping": [222],
              }
              assert db.payload["claim"]["label"] == "Je prends"


          def test_clear_panel_roles_does_not_touch_staff_buttons():
              payload = {
                  "claim": {"enabled": True, "label": "Prendre"},
                  tickets.PANEL_ROLE_META_KEY: {
                      "1": {"access": [1], "ping": [2]},
                      "2": {"access": [3], "ping": []},
                  },
              }
              db = FakeDB(payload)
              bot = SimpleNamespace(db=db)
              run(tickets.clear_panel_role_settings(bot, 42, 1))
              assert "1" not in db.payload[tickets.PANEL_ROLE_META_KEY]
              assert "2" in db.payload[tickets.PANEL_ROLE_META_KEY]
              assert db.payload["claim"]["label"] == "Prendre"


          def test_ticket_creation_source_uses_panel_access_and_safe_role_mentions():
              import inspect
              source = inspect.getsource(tickets.Tickets.create_ticket)
              assert 'panel_roles["access"]' in source
              assert 'panel_roles["ping"]' in source
              assert "discord.AllowedMentions" in source
              assert "manage_channels=True" not in source[source.index('panel_roles ='):source.index('category =', source.index('panel_roles ='))]
          ''', encoding='utf-8')
