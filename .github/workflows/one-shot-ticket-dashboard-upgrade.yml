name: One-shot ticket dashboard upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-ticket-dashboard-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply canonical ticket dashboard upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cogs/tickets.py')
          src = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              src = src.replace(old, new, 1)

          old = '''async def get_button_settings(bot, guild_id: int) -> dict:
              row = await bot.db.fetchone("SELECT config_json FROM ticket_button_settings WHERE guild_id = ?", (guild_id,))
              settings = default_button_settings()
              if row and row["config_json"]:
                  try:
                      saved = json.loads(row["config_json"])
                      for key, cfg in saved.items():
                          if key in settings:
                              settings[key].update(cfg)
                  except (ValueError, TypeError):
                      pass
              return settings


          async def save_button_settings(bot, guild_id: int, settings: dict):
              await bot.db.execute(
                  "INSERT INTO ticket_button_settings (guild_id, config_json) VALUES (?, ?) "
                  "ON CONFLICT(guild_id) DO UPDATE SET config_json = excluded.config_json",
                  (guild_id, json.dumps(settings)),
              )
          '''
          new = '''PANEL_ROLE_META_KEY = "__panel_roles__"
          MAX_PANEL_ROLES = 10


          async def _load_ticket_settings_payload(bot, guild_id: int) -> dict:
              """Charge le JSON partagé des réglages tickets sans jeter les extensions futures.

              Historiquement cette table ne contenait que les 9 boutons staff. Les réglages
              de rôles de panel sont ajoutés sous une clé réservée afin de rester 100 %
              compatibles avec les bases existantes, sans nouvelle table ni migration risquée.
              """
              row = await bot.db.fetchone(
                  "SELECT config_json FROM ticket_button_settings WHERE guild_id = ?", (guild_id,)
              )
              if not row or not row["config_json"]:
                  return {}
              try:
                  payload = json.loads(row["config_json"])
              except (ValueError, TypeError):
                  return {}
              return payload if isinstance(payload, dict) else {}


          async def _save_ticket_settings_payload(bot, guild_id: int, payload: dict) -> None:
              await bot.db.execute(
                  "INSERT INTO ticket_button_settings (guild_id, config_json) VALUES (?, ?) "
                  "ON CONFLICT(guild_id) DO UPDATE SET config_json = excluded.config_json",
                  (guild_id, json.dumps(payload, separators=(",", ":"))),
              )


          async def get_button_settings(bot, guild_id: int) -> dict:
              payload = await _load_ticket_settings_payload(bot, guild_id)
              settings = default_button_settings()
              for key, cfg in payload.items():
                  if key in settings and isinstance(cfg, dict):
                      settings[key].update(cfg)
              return settings


          async def save_button_settings(bot, guild_id: int, settings: dict):
              # Conserve les métadonnées de panels : personnaliser un bouton staff ne doit
              # jamais effacer les rôles d'accès/ping configurés dans le dashboard.
              payload = await _load_ticket_settings_payload(bot, guild_id)
              for key in STAFF_BUTTONS:
                  if key in settings:
                      payload[key] = settings[key]
              await _save_ticket_settings_payload(bot, guild_id, payload)


          def _normalise_role_ids(values) -> list[int]:
              result: list[int] = []
              for value in values or []:
                  try:
                      role_id = int(getattr(value, "id", value))
                  except (TypeError, ValueError):
                      continue
                  if role_id > 0 and role_id not in result:
                      result.append(role_id)
                  if len(result) >= MAX_PANEL_ROLES:
                      break
              return result


          async def get_panel_role_settings(bot, guild_id: int, panel_id: int) -> dict[str, list[int]]:
              payload = await _load_ticket_settings_payload(bot, guild_id)
              all_panels = payload.get(PANEL_ROLE_META_KEY, {})
              if not isinstance(all_panels, dict):
                  all_panels = {}
              raw = all_panels.get(str(panel_id), {})
              if not isinstance(raw, dict):
                  raw = {}
              return {
                  "ping": _normalise_role_ids(raw.get("ping", [])),
                  "access": _normalise_role_ids(raw.get("access", [])),
              }


          async def save_panel_role_settings(
              bot, guild_id: int, panel_id: int, kind: str, role_ids
          ) -> dict[str, list[int]]:
              if kind not in {"ping", "access"}:
                  raise ValueError(f"Unsupported panel role kind: {kind}")
              payload = await _load_ticket_settings_payload(bot, guild_id)
              all_panels = payload.setdefault(PANEL_ROLE_META_KEY, {})
              if not isinstance(all_panels, dict):
                  all_panels = {}
                  payload[PANEL_ROLE_META_KEY] = all_panels
              current = all_panels.setdefault(str(panel_id), {})
              if not isinstance(current, dict):
                  current = {}
                  all_panels[str(panel_id)] = current
              current[kind] = _normalise_role_ids(role_ids)
              await _save_ticket_settings_payload(bot, guild_id, payload)
              return await get_panel_role_settings(bot, guild_id, panel_id)


          async def clear_panel_role_settings(bot, guild_id: int, panel_id: int) -> None:
              payload = await _load_ticket_settings_payload(bot, guild_id)
              all_panels = payload.get(PANEL_ROLE_META_KEY)
              if isinstance(all_panels, dict) and all_panels.pop(str(panel_id), None) is not None:
                  if not all_panels:
                      payload.pop(PANEL_ROLE_META_KEY, None)
                  await _save_ticket_settings_payload(bot, guild_id, payload)
          '''
          replace_once(old, new, 'settings helpers')

          marker = '''class CloseReasonModal(discord.ui.Modal, title="🔒 Fermer le ticket"):
          '''
          insert = '''class TypeButtonModal(discord.ui.Modal, title="🔘 Bouton d'ouverture"):
              """Personnalise le bouton d'un type sans mélanger son identité avec son texte métier."""

              def __init__(self, cog: "Tickets", ticket_type):
                  super().__init__()
                  self.cog = cog
                  self.type_id = int(ticket_type["id"])
                  self.label = discord.ui.TextInput(
                      label="Nom affiché sur le bouton",
                      default=ticket_type["button_label"] or ticket_type["name"] or "Ticket",
                      max_length=80,
                  )
                  self.emoji = discord.ui.TextInput(
                      label="Emoji (optionnel)",
                      default=ticket_type["emoji"] or "",
                      required=False,
                      max_length=100,
                  )
                  current_style = ticket_type["button_style"] or DEFAULT_BUTTON_STYLE
                  if current_style not in BUTTON_STYLES:
                      current_style = DEFAULT_BUTTON_STYLE
                  self.style = discord.ui.TextInput(
                      label=f"Couleur ({'/'.join(BUTTON_STYLE_NAMES)})",
                      default=current_style,
                      max_length=5,
                  )
                  self.add_item(self.label)
                  self.add_item(self.emoji)
                  self.add_item(self.style)

              async def on_submit(self, interaction: discord.Interaction):
                  style = self.style.value.strip().lower()
                  if style not in BUTTON_STYLES:
                      return await interaction.response.send_message(
                          embed=embeds.error(
                              f"Couleur invalide — choisissez parmi : {', '.join(BUTTON_STYLE_NAMES)}."
                          ),
                          ephemeral=True,
                      )
                  raw_emoji = self.emoji.value.strip()
                  emoji = parse_component_emoji(raw_emoji, interaction.client)
                  if raw_emoji and emoji is None:
                      return await interaction.response.send_message(
                          embed=embeds.error(
                              "Cet emoji n'est pas utilisable. Choisissez un emoji Unicode ou un emoji Discord complet."
                          ),
                          ephemeral=True,
                      )
                  await self.cog.bot.db.execute(
                      "UPDATE ticket_types SET button_label = ?, emoji = ?, button_style = ? WHERE id = ?",
                      (self.label.value.strip(), str(emoji) if emoji else None, style, self.type_id),
                  )
                  await interaction.response.send_message(
                      embed=embeds.success("Le bouton d'ouverture a été mis à jour."), ephemeral=True
                  )


          class CloseReasonModal(discord.ui.Modal, title="🔒 Fermer le ticket"):
          '''
          replace_once(marker, insert, 'type button modal')

          start = src.index('class PanelEditView(discord.ui.View):')
          end = src.index('\n\nclass TypeEditView(discord.ui.View):', start)
          old_block = src[start:end]
          new_block = '''class PanelRolesView(discord.ui.View):
              """Rôles propres à un panel : accès au salon et notifications sont indépendants.

              Un rôle d'accès n'obtient AUCUNE permission de modération globale : uniquement
              les overwrites du salon de ticket créé depuis ce panel.
              """

              def __init__(self, cog: "Tickets", panel_id: int, guild_id: int, author_id: int):
                  super().__init__(timeout=300)
                  self.cog = cog
                  self.panel_id = panel_id
                  self.guild_id = guild_id
                  self.author_id = author_id

              async def interaction_check(self, interaction: discord.Interaction) -> bool:
                  if interaction.user.id != self.author_id or not interaction.guild or interaction.guild.id != self.guild_id:
                      await interaction.response.send_message(
                          embed=embeds.error("Ce menu de configuration ne vous appartient pas."), ephemeral=True
                      )
                      return False
                  panel = await self.cog.get_panel(self.panel_id)
                  if not panel or panel["guild_id"] != self.guild_id:
                      await interaction.response.send_message(
                          embed=embeds.error("Ce panel n'existe plus sur ce serveur."), ephemeral=True
                      )
                      return False
                  return True

              async def _save(self, interaction: discord.Interaction, kind: str, roles) -> None:
                  valid = [
                      role for role in roles
                      if isinstance(role, discord.Role)
                      and role.guild.id == self.guild_id
                      and not role.is_default()
                  ]
                  await save_panel_role_settings(
                      self.cog.bot, self.guild_id, self.panel_id, kind, [role.id for role in valid]
                  )
                  label = "notifiés" if kind == "ping" else "autorisés à accéder aux tickets"
                  value = ", ".join(role.mention for role in valid) if valid else "Aucun"
                  await interaction.response.send_message(
                      embed=embeds.success(f"Rôles {label} : {value}."), ephemeral=True
                  )

              @discord.ui.select(
                  cls=discord.ui.RoleSelect,
                  placeholder="🔔 Rôles à ping à l'ouverture (1 à 10)",
                  min_values=1,
                  max_values=MAX_PANEL_ROLES,
                  row=0,
              )
              async def ping_roles(self, interaction: discord.Interaction, select: discord.ui.RoleSelect):
                  await self._save(interaction, "ping", select.values)

              @discord.ui.select(
                  cls=discord.ui.RoleSelect,
                  placeholder="🔑 Rôles ayant accès aux tickets (1 à 10)",
                  min_values=1,
                  max_values=MAX_PANEL_ROLES,
                  row=1,
              )
              async def access_roles(self, interaction: discord.Interaction, select: discord.ui.RoleSelect):
                  await self._save(interaction, "access", select.values)

              @discord.ui.button(label="Effacer les rôles ping", style=discord.ButtonStyle.secondary, row=2)
              async def clear_ping(self, interaction: discord.Interaction, button: discord.ui.Button):
                  await save_panel_role_settings(self.cog.bot, self.guild_id, self.panel_id, "ping", [])
                  await interaction.response.send_message(
                      embed=embeds.success("Aucun rôle ne sera ping automatiquement pour ce panel."), ephemeral=True
                  )

              @discord.ui.button(label="Effacer les rôles d'accès", style=discord.ButtonStyle.secondary, row=2)
              async def clear_access(self, interaction: discord.Interaction, button: discord.ui.Button):
                  await save_panel_role_settings(self.cog.bot, self.guild_id, self.panel_id, "access", [])
                  await interaction.response.send_message(
                      embed=embeds.success("Les rôles d'accès supplémentaires ont été retirés."), ephemeral=True
                  )


          class PanelTypePickerView(discord.ui.View):
              def __init__(self, cog: "Tickets", panel_id: int, guild_id: int, author_id: int, types: list):
                  super().__init__(timeout=300)
                  self.cog = cog
                  self.panel_id = panel_id
                  self.guild_id = guild_id
                  self.author_id = author_id
                  options = [
                      discord.SelectOption(
                          label=(t["button_label"] or t["name"] or "Ticket")[:100],
                          value=str(t["id"]),
                          description=(t["description"] or "Modifier nom, bouton, formulaire ou supprimer")[:100],
                          emoji=parse_component_emoji(t["emoji"]),
                      )
                      for t in types[:25]
                  ]
                  select = discord.ui.Select(
                      placeholder="🔘 Choisissez le bouton / type à modifier",
                      options=options,
                      min_values=1,
                      max_values=1,
                  )
                  select.callback = self._pick
                  self.selector = select
                  self.add_item(select)

              async def interaction_check(self, interaction: discord.Interaction) -> bool:
                  if interaction.user.id != self.author_id or not interaction.guild or interaction.guild.id != self.guild_id:
                      await interaction.response.send_message(
                          embed=embeds.error("Ce menu de configuration ne vous appartient pas."), ephemeral=True
                      )
                      return False
                  return True

              async def _pick(self, interaction: discord.Interaction):
                  type_id = int(self.selector.values[0])
                  ticket_type = await self.cog.get_type(type_id)
                  if not ticket_type or ticket_type["guild_id"] != self.guild_id or ticket_type["panel_id"] != self.panel_id:
                      return await interaction.response.send_message(
                          embed=embeds.error("Ce type de ticket n'existe plus dans ce panel."), ephemeral=True
                      )
                  await interaction.response.send_message(
                      embed=embeds.neutral(
                          f"⚙️ Modifier « {ticket_type['name']} »",
                          "Vous pouvez modifier le texte, le bouton, les limites, les rôles et le formulaire, ou supprimer ce type.",
                      ),
                      view=TypeEditView(self.cog, type_id, self.author_id),
                      ephemeral=True,
                  )


          class PanelPickerView(discord.ui.View):
              """Sélecteur du dashboard : un clic suffit pour ouvrir l'éditeur d'un panel."""

              def __init__(self, cog: "Tickets", guild_id: int, author_id: int, panels: list):
                  super().__init__(timeout=300)
                  self.cog = cog
                  self.guild_id = guild_id
                  self.author_id = author_id
                  options = []
                  for panel in panels[:25]:
                      state = "Actif" if panel["enabled"] else "Désactivé"
                      options.append(
                          discord.SelectOption(
                              label=(panel["name"] or f"Panel #{panel['id']}")[:100],
                              value=str(panel["id"]),
                              description=f"{state} • cliquez pour modifier"[:100],
                          )
                      )
                  selector = discord.ui.Select(
                      placeholder="⚙️ Choisissez un panel à modifier",
                      options=options,
                      min_values=1,
                      max_values=1,
                  )
                  selector.callback = self._pick
                  self.selector = selector
                  self.add_item(selector)

              async def interaction_check(self, interaction: discord.Interaction) -> bool:
                  if interaction.user.id != self.author_id or not interaction.guild or interaction.guild.id != self.guild_id:
                      await interaction.response.send_message(
                          embed=embeds.error("Ce dashboard ne vous appartient pas."), ephemeral=True
                      )
                      return False
                  return True

              async def _pick(self, interaction: discord.Interaction):
                  panel_id = int(self.selector.values[0])
                  panel = await self.cog.get_panel(panel_id)
                  if not panel or panel["guild_id"] != self.guild_id:
                      return await interaction.response.send_message(
                          embed=embeds.error("Ce panel n'existe plus sur ce serveur."), ephemeral=True
                      )
                  roles = await get_panel_role_settings(self.cog.bot, self.guild_id, panel_id)
                  await interaction.response.send_message(
                      embed=embeds.neutral(
                          f"⚙️ Panel « {panel['name']} »",
                          f"Accès supplémentaires : **{len(roles['access'])}** rôle(s) • "
                          f"Pings : **{len(roles['ping'])}** rôle(s).\nChoisissez ce que vous voulez modifier.",
                      ),
                      view=PanelEditView(self.cog, panel_id, self.author_id),
                      ephemeral=True,
                  )


          class PanelEditView(discord.ui.View):
              """Dashboard complet d'un panel : apparence, accès, boutons, salon et suppression."""

              def __init__(self, cog: "Tickets", panel_id: int, author_id: int):
                  super().__init__(timeout=300)
                  self.cog = cog
                  self.panel_id = panel_id
                  self.author_id = author_id

              async def interaction_check(self, interaction: discord.Interaction) -> bool:
                  if interaction.user.id != self.author_id:
                      await interaction.response.send_message(
                          embed=embeds.error("Seul l'auteur de ce dashboard peut modifier le panel."), ephemeral=True
                      )
                      return False
                  panel = await self.cog.get_panel(self.panel_id)
                  if not panel or not interaction.guild or panel["guild_id"] != interaction.guild.id:
                      await interaction.response.send_message(
                          embed=embeds.error("Ce panel n'existe plus sur ce serveur."), ephemeral=True
                      )
                      return False
                  return True

              @discord.ui.button(label="Titre / Description", style=discord.ButtonStyle.secondary, emoji="📝", row=0)
              async def edit_text(self, interaction: discord.Interaction, button: discord.ui.Button):
                  panel = await self.cog.get_panel(self.panel_id)
                  await interaction.response.send_modal(PanelTextModal(self.cog, panel))

              @discord.ui.button(label="Image / Couleur", style=discord.ButtonStyle.secondary, emoji="🎨", row=0)
              async def edit_media(self, interaction: discord.Interaction, button: discord.ui.Button):
                  panel = await self.cog.get_panel(self.panel_id)
                  await interaction.response.send_modal(PanelMediaModal(self.cog, panel))

              @discord.ui.button(label="Limite / membre", style=discord.ButtonStyle.secondary, emoji="🔢", row=0)
              async def edit_max(self, interaction: discord.Interaction, button: discord.ui.Button):
                  panel = await self.cog.get_panel(self.panel_id)
                  await interaction.response.send_modal(PanelMaxModal(self.cog, panel))

              @discord.ui.button(label="Accès & Pings", style=discord.ButtonStyle.primary, emoji="🔑", row=0)
              async def edit_roles(self, interaction: discord.Interaction, button: discord.ui.Button):
                  cfg = await get_panel_role_settings(self.cog.bot, interaction.guild.id, self.panel_id)
                  access = [interaction.guild.get_role(rid) for rid in cfg["access"]]
                  ping = [interaction.guild.get_role(rid) for rid in cfg["ping"]]
                  access_text = ", ".join(r.mention for r in access if r) or "Aucun"
                  ping_text = ", ".join(r.mention for r in ping if r) or "Aucun"
