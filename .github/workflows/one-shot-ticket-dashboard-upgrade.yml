                  )

              @discord.ui.button(label="📤 Envoyer / mettre à jour", style=discord.ButtonStyle.success, row=3)
              async def send_panel(self, interaction: discord.Interaction, button: discord.ui.Button):
                  await self.cog.send_panel(interaction, self.panel_id)

              @discord.ui.button(label="Supprimer le panel", style=discord.ButtonStyle.danger, emoji="🗑️", row=3)
              async def delete_panel(self, interaction: discord.Interaction, button: discord.ui.Button):
                  panel = await self.cog.get_panel(self.panel_id)
                  types = await self.cog.get_panel_types(self.panel_id)
                  confirm = helpers.ConfirmView(self.author_id)
                  await interaction.response.send_message(
                      embed=embeds.warning(
                          f"Supprimer définitivement **{panel['name']}** et ses **{len(types)}** bouton(s)/type(s) ?"
                      ),
                      view=confirm,
                      ephemeral=True,
                  )
                  await confirm.wait()
