name: SentriX Acceptance Diagnostic

on:
  push:
    branches: [acceptance/user-journeys]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: acceptance/user-journeys
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Capture exact acceptance result
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-user-acceptance-diagnostic.db"
        run: python -u tools/run_acceptance_diagnostic.py
      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/.acceptance_failure.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record acceptance diagnostic result"
          git push origin HEAD:acceptance/user-journeys
