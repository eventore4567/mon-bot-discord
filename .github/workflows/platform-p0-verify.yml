name: Platform P0 Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-p0-verify.yml"
      - "tools/platform_p0/**"
  workflow_dispatch:

concurrency:
  group: platform-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-security-gate:
    name: P0 Security Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/sentrix_test
      MIGRATIONS_DATABASE_URL: postgresql://sentrix_migrator:migrator_dev_only@localhost:5432/sentrix_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentrix_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Extraire sentrix-platform
        run: |
          cat tools/platform_p0/bundle.part*.b64 | base64 --decode > /tmp/sentrix-platform.zip
          unzip -q /tmp/sentrix-platform.zip -d /tmp/platform-src
          test -f /tmp/platform-src/sentrix-platform/pyproject.toml

      - name: Installer les dependances
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Creer les roles
        working-directory: /tmp/platform-src/sentrix-platform
        run: psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f ops/bootstrap/roles.sql

      - name: Accorder le schema au migrator
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -c "GRANT CREATE, USAGE ON SCHEMA public TO sentrix_migrator;" \
            -c "GRANT USAGE ON SCHEMA public TO sentrix_app;"

      - name: Verifier les privileges RLS du role applicatif
        run: |
          result=$(psql "$SUPERUSER_URL" -tAc \
            "SELECT rolbypassrls OR rolsuper FROM pg_roles WHERE rolname='sentrix_app'")
          echo "sentrix_app privileged=$result"
          test "$result" = "f"

      - name: Appliquer les migrations
        working-directory: /tmp/platform-src/sentrix-platform
        run: python -m libs.db.migrate

      - name: Verifier l'idempotence des migrations
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          output=$(python -m libs.db.migrate)
          echo "$output"
          echo "$output" | grep -q "deja a jour"

      - name: GATE - 12 attaques cross-tenant
        working-directory: /tmp/platform-src/sentrix-platform
        run: pytest tests/security -v -m security --tb=short --strict-markers

      - name: Tests unitaires et integration
        working-directory: /tmp/platform-src/sentrix-platform
        run: pytest tests/unit tests/integration -v --tb=short

      - name: Ruff
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy strict
        working-directory: /tmp/platform-src/sentrix-platform
        run: mypy libs services
