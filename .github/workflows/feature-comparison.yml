name: SentriX Feature Comparison
on:
  pull_request:
    paths:
      - "cogs/feature_comparison.py"
      - "main.py"
      - "tests/test_setup_feature_comparison.py"
      - ".github/workflows/feature-comparison.yml"
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - "cogs/feature_comparison.py"
      - "main.py"
jobs:
  feature-comparison:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Syntax verification
        run: python -m py_compile cogs/feature_comparison.py main.py
      - name: Safe third-party feature matching
        run: python -m pytest tests/test_setup_feature_comparison.py -q
