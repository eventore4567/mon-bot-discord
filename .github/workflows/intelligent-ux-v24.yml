name: Legacy SentriX V2.4 Intelligent UX

# Conservé uniquement comme outil manuel d'historique. Les tests utiles sont désormais
# exécutés par SentriX Preproduction avec les contrats du runtime canonique actuel.
on:
  workflow_dispatch:

jobs:
  legacy-intelligent-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DISCORD_TOKEN: "ci.fake.token"
      DATABASE_PATH: "/tmp/sentrix-legacy-v24.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Discord runtime
        run: python -m pip install 'discord.py>=2.6.3,<3.0'
      - name: Pure Intelligent UX tests
        run: python -m unittest tests.test_intelligent_ux
