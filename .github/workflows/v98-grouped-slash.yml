name: SentriX V98 Grouped Slash

on:
  pull_request:
  workflow_dispatch:

jobs:
  v98-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile V98/V99/V101/music
        run: |
          python -m compileall -q sentrix_v98_slash.py sentrix_grouped_slash_fix.py sentrix_v98_boot.py sentrix_v98_ha_product_boot.py sentrix_v101_command_runtime.py sentrix_music_providers_v102.py utils/music/providers/soundcloud.py web/giveaway_dashboard_v101.py cogs/dashboard_runtime_patch.py tools/v98_grouped_slash_gate.py

      - name: V98 semantic slash gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v98.db"
        run: python tools/v98_grouped_slash_gate.py

      - name: V99 grouped argument binding tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v99.db"
          PYTHONPATH: "."
        run: python -m pytest -q tests/test_grouped_slash_arguments_v99.py

      - name: V101 command runtime regression tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v101.db"
          PYTHONPATH: "."
        run: python -m pytest -q tests/test_v101_command_runtime.py

      - name: V101 giveaway dashboard regression tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v101-giveaway.db"
          PYTHONPATH: "."
        run: python -m pytest -q tests/test_giveaway_dashboard_v101.py

      - name: Music smooth audio regression tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-music-smooth.db"
          PYTHONPATH: "."
        run: python -m pytest -q tests/test_music_smooth_audio.py
