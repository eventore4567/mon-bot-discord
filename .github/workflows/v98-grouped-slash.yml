name: SentriX V98 Grouped Slash

on:
  pull_request:
  workflow_dispatch:

jobs:
  v98-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile V98
        run: |
          python -m compileall -q sentrix_v98_slash.py sentrix_v98_boot.py sentrix_v98_ha_product_boot.py tools/v98_grouped_slash_gate.py

      - name: V98 semantic slash gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v98.db"
        run: python tools/v98_grouped_slash_gate.py
