name: AutoMod Center

on:
  pull_request:
    paths:
      - 'cogs/automod_center_v118.py'
      - 'cogs/setup_control_center.py'
      - 'tests/test_automod_center_v118.py'
      - 'tests/test_invite_feed_order_v119.py'
      - 'cogs/invites.py'
      - 'cogs/invite_tracker_runtime.py'
      - '.github/workflows/automod-center-v118.yml'
  workflow_dispatch:

jobs:
  automod-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed source
        run: python -m py_compile cogs/automod_center_v118.py cogs/setup_control_center.py cogs/invites.py cogs/invite_tracker_runtime.py
      - name: Run AutoMod panel tests
        env:
          DISCORD_TOKEN: "ci-placeholder-not-a-real-token"
        run: python -m pytest -q tests/test_automod_center_v118.py tests/test_invite_feed_order_v119.py
