name: Apply reviewed Permissions V3 patch

on:
  push:
    branches:
      - fix/permissions-v3-unified
    paths:
      - .github/workflows/apply-permissions-v3.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/permissions-v3/part-*.patch > /tmp/sentrix-permissions-v3.patch
          git apply --check /tmp/sentrix-permissions-v3.patch
          git apply /tmp/sentrix-permissions-v3.patch

      - name: Apply review corrections
        run: python patches/permissions-v3/hotfix.py

      - name: Compile modified Python files
        shell: bash
        run: |
          python -m py_compile \
            cogs/log_identity_context_v60.py \
            cogs/permission_guard.py \
            cogs/runtime_consistency_v57.py \
            cogs/sentrix_final_quality_v38.py \
            cogs/setup_v2_core.py \
            cogs/setup_v2_runtime.py \
            main.py \
            tests/test_access_matrix.py \
            tests/test_setup_help_control_center_v2.py \
            utils/access_matrix.py

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Permission matrix regression tests
        run: python tests/test_access_matrix.py

      - name: Setup and permission integration tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_setup_help_control_center_v2.py \
            tests/test_setup_v2_runtime.py \
            tests/test_setup_v2_completion.py

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cogs/log_identity_context_v60.py \
            cogs/permission_guard.py \
            cogs/runtime_consistency_v57.py \
            cogs/sentrix_final_quality_v38.py \
            cogs/setup_v2_core.py \
            cogs/setup_v2_runtime.py \
            main.py \
            tests/test_access_matrix.py \
            tests/test_setup_help_control_center_v2.py \
            utils/access_matrix.py
          git diff --cached --check
          git commit -m "fix: unify SentriX permissions across prefix and slash"
          git push origin HEAD:fix/permissions-v3-unified
