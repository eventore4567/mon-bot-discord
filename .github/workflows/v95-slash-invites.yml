name: SentriX V95 Slash + Invites

on:
  pull_request:
  workflow_dispatch:

jobs:
  v95-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile V95/V96/V97
        run: |
          python -m compileall -q sentrix_v95_runtime.py sentrix_v95_bootstrap.py sentrix_v97_reliability.py sentrix_verification_v96.py sentrix_verification_v96_finalizer.py sitecustomize.py railway_ha_product_boot.py cogs/sentrix_regression_fix.py tools/v95_slash_invites_gate.py tools/v97_reliability_gate.py

      - name: Full V95/V96 registry gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          OPENAI_API_KEY: "ci.fake.key"
          SENTRIX_CI_OFFLINE: "1"
          DATABASE_PATH: "/tmp/sentrix-v95.db"
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/sentrix-v95-gate.log
          import asyncio
          import logging

          # V18 peut signaler un état intermédiaire pendant le chargement des extensions.
          # Le registre final est audité juste après ; en CI hors-ligne ce warning transitoire
          # n'apporte donc aucune information actionnable.
          logging.getLogger("bot.command-runtime-hardening-v18").setLevel(logging.ERROR)

          from tools.v95_slash_invites_gate import run
          raise SystemExit(asyncio.run(run()))
          PY

          if grep -E "paramètres internes encore exposés|OPENAI_API_KEY is missing|Role panel persistent view restore failed" /tmp/sentrix-v95-gate.log; then
            echo "[ERROR] Un résidu runtime V99 interdit est encore présent dans le gate V95."
            exit 1
          fi

      - name: V97 slash execution + ticket dashboard gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-v97.db"
        run: python tools/v97_reliability_gate.py
