name: SentriX prefix removal notice
on:
  push:
    branches:
      - fix/prod-prefix-announcement-only-20261029
      - dashboard-refonte-2026-09
  pull_request:
    paths:
      - cogs/prefix_deprecation.py
      - cogs/help_complete_v79.py
      - main.py
      - tests/test_prefix_deprecation.py
      - tools/prefix_deprecation_e2e.py
      - tools/sentrix_e2e_harness.py
      - web/dashboard_ui/js/40_tools.js
      - .github/workflows/prefix-notice-only.yml

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DISCORD_TOKEN: ci.fake.token
      DATABASE_PATH: /tmp/sentrix-prefix-notice-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests for prefix retirement notice
        run: python -m pytest -q tests/test_prefix_deprecation.py
      - name: Production-like end-to-end prefix warning
        run: python tools/prefix_deprecation_e2e.py
