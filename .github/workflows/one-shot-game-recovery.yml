name: One-shot SentriX Game Recovery

on:
  push:
    branches: [audit/game-cog-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/game-cog-recovery
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply clean recovery
        run: |
          python tools/one_shot_game_recovery.py
          git mv games_economy.py cogs/games_economy.py
          rm tools/one_shot_game_recovery.py
          rm .github/workflows/one-shot-game-recovery.yml
      - name: Commit final branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate recovered game suite safely"
          git push origin HEAD:audit/game-cog-recovery
