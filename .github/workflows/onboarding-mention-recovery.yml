name: SentriX Onboarding and Mention Recovery
on:
  pull_request:
    paths:
      - 'utils/sentrix_panels.py'
      - 'utils/command_visuals.py'
      - 'utils/sentrix_trace.py'
      - 'utils/top_command_banners.py'
      - 'utils/wide_logs.py'
      - 'cogs/log_history_center.py'
      - 'cogs/logs.py'
      - 'cogs/music.py'
      - 'cogs/setup_experience_v74.py'
      - 'cogs/setup_components_v73.py'
      - 'database/db.py'
      - 'tests/test_explicit_activation_regressions.py'
      - 'cogs/automod.py'
      - 'cogs/setup_v2_completion.py'
      - 'cogs/setup_v2_core.py'
      - 'cogs/sentrix_ultimate.py'
      - 'utils/onboarding_recovery.py'
      - 'utils/welcome_autoroles.py'
      - 'tests/test_onboarding_recovery.py'
      - 'tests/test_mass_mentions_immediate.py'
      - '.github/workflows/onboarding-mention-recovery.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ci.fake.token
      DATABASE_PATH: /tmp/sentrix-onboarding-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: >-
          python -m pytest -q
          tests/test_onboarding_recovery.py
          tests/test_mass_mentions_immediate.py
          tests/test_welcome_autoroles.py
          tests/test_welcome_single_source_of_truth.py
          tests/test_modules_off_par_defaut.py
          tests/test_explicit_activation_regressions.py
          tests/test_bienvenue_ping.py
          tests/test_module_cache_coherence.py
          tests/test_soundboard_logs.py
          tests/test_message_log_transcripts.py
          tests/test_log_banners.py
          tests/test_banniere_setup_help.py
          tests/test_music_player_experience.py
          tests/test_setup_home_status.py
          tests/test_config_center_level_opt_in.py
          tests/test_automod_cross_channel_spam_v125.py
          tests/test_automod_enforcement_resilience.py
          tests/test_automod_idempotent_sanctions_v131.py
          tests/test_join_dedup.py
          tests/test_ha_sigterm_failover.py
