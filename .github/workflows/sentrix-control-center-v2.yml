name: SentriX Control Center V2 safety

on:
  pull_request:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'web/dashboard_ui/**'
      - 'tests/js/security_multiselect.test.cjs'
      - 'tests/test_sentrix_control_center_v2.py'
      - '.github/workflows/sentrix-control-center-v2.yml'
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'web/dashboard_ui/**'
      - 'tests/js/security_multiselect.test.cjs'
      - 'tests/test_sentrix_control_center_v2.py'
      - '.github/workflows/sentrix-control-center-v2.yml'

jobs:
  security-picker-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
      - name: Install standalone DOM testing tools
        run: npm install --prefix /tmp/sentrix-control-ui --no-save --no-package-lock jsdom@26
      - name: Validate all source JavaScript files syntax
        run: |
          for file in web/dashboard_ui/js/*.js; do
            node --check "$file"
          done
      - name: Exercise real checkbox picker against HTML select state
        env:
          NODE_PATH: /tmp/sentrix-control-ui/node_modules
        run: node --test tests/js/security_multiselect.test.cjs
      - name: Verify canonical dashboard, existing features and security contracts
        run: |
          python -m pytest -q \
            tests/test_sentrix_control_center_v2.py \
            tests/test_dashboard_unified_v2.py \
            tests/test_sentrix_normal_visual_polish.py \
            tests/test_security_filter_policy.py \
            tests/test_security_message_bypass_regression.py
