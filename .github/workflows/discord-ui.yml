name: SentriX Discord UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  discord-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile authoritative runtime
        run: |
          python -m compileall -q \
            utils/embeds.py \
            utils/log_service.py \
            utils/helpers.py \
            cogs/help.py \
            cogs/logs.py \
            cogs/generated_logs_sync.py \
            cogs/final_interaction_policy.py \
            cogs/command_embed_invariant.py \
            cogs/production_embed_log_repair.py \
            cogs/production_embed_log_repair_v3.py \
            cogs/slash_error_completion_guard.py \
            cogs/error_experience_v3.py \
            cogs/command_error_release_v41.py \
            cogs/__init__.py
      - name: Run Discord UI contracts
        run: |
          PYTHONPATH=. python tests/test_discord_ui_contract.py
          PYTHONPATH=. python tests/test_command_embed_invariant.py
          PYTHONPATH=. python tests/test_production_embed_log_repair.py
          PYTHONPATH=. python tests/test_production_embed_log_repair_v3.py
          PYTHONPATH=. python tests/test_logs_alias_error_embed_v4.py
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-discord-ui.db"
