name: Resolve PR 326 against production

on:
  push:
    branches:
      - audit/slash-commands-tickets-permissions
    paths:
      - .github/workflows/resolve-pr326.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: audit/slash-commands-tickets-permissions
          fetch-depth: 0

      - name: Merge production branch and resolve the known main.py conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/v98-grouped-slash

          set +e
          git merge --no-commit --no-ff origin/fix/v98-grouped-slash
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "main.py" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && [ "$conflicts" != "main.py" ]; then
            echo "Merge failed for a reason other than the known main.py conflict."
            exit 1
          fi

          if [ "$conflicts" = "main.py" ]; then
            git checkout --theirs main.py
            python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          ind = "        "

          dynamic_lines = [
              "# Étoiles de notation envoyées en DM après la fermeture d'un ticket (RatingView) :",
              "# même mécanisme que SetupNavButton, custom_id encodant la note ET l'ID du ticket.",
              "try:",
              "    from cogs.tickets import TicketRatingButton",
              "    self.add_dynamic_items(TicketRatingButton)",
              "except Exception:",
              "    logger.warning(\"Impossible d'enregistrer les boutons de notation tickets :\\n\" + traceback.format_exc())",
              "",
              "# Boutons \"Copier l'ID\" des logs (utils/log_service.py::RevealIdButton) : même",
              "# mécanisme, custom_id encodant l'ID à réafficher.",
              "try:",
              "    from utils.log_service import RevealIdButton",
              "    self.add_dynamic_items(RevealIdButton)",
              "except Exception:",
              "    logger.warning(\"Impossible d'enregistrer les boutons de logs :\\n\" + traceback.format_exc())",
              "",
          ]
          dynamic_block = "\n".join(ind + line if line else "" for line in dynamic_lines) + "\n"

          add_check_marker = ind + "self.add_check(self.global_blacklist_check)\n"
          if "self.add_dynamic_items(TicketRatingButton)" not in text:
              if add_check_marker not in text:
                  raise SystemExit("main.py marker for dynamic items not found")
              text = text.replace(add_check_marker, dynamic_block + add_check_marker, 1)

          resync_lines = [
              "",
              "# Corrige la cause structurelle commune : quand un wrapper remplace",
              "# command.callback après la construction d'une HybridCommand, discord.py garde",
              "# une ancienne référence dans app_command._callback. On réaligne tout juste",
              "# avant le sync global afin que / et + exécutent exactement le même callback.",
              "try:",
              "    from cogs.hybrid_callback_resync import resync as _resync_hybrid_callbacks",
              "",
              "    _resync_hybrid_callbacks(self)",
              "except Exception:",
              "    logger.warning(",
              "        \"Resynchronisation callback slash/préfixe impossible :\\n\" + traceback.format_exc()",
              "    )",
              "",
          ]
          resync_block = "\n".join(ind + line if line else "" for line in resync_lines) + "\n"

          checks_marker = (
              ind + "self.add_check(self.global_blacklist_check)\n"
              + ind + "self.add_check(self.global_cooldown_check)\n"
              + ind + "self.add_check(self.global_permission_check)\n\n"
          )
          if "_resync_hybrid_callbacks(self)" not in text:
              if checks_marker not in text:
                  raise SystemExit("main.py marker for hybrid callback resync not found")
              text = text.replace(checks_marker, checks_marker + resync_block, 1)

          path.write_text(text, encoding="utf-8")
          PY
            git add main.py
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          git diff --check

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile merged runtime
        run: python -m compileall -q main.py cogs database utils tools

      - name: Full regression suite
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-pr326.db"
          PYTHONPATH: "."
        run: python -m pytest -q

      - name: Command runtime audits
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-pr326-audit.db"
          PYTHONPATH: "."
        run: |
          python tools/command_runtime_audit.py
          python tools/command_callback_integrity_audit.py

      - name: Commit resolved merge and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-pr326.yml
          git add -A
          git commit -m "merge: resolve PR #326 against V101 production"
          git push origin HEAD:audit/slash-commands-tickets-permissions
