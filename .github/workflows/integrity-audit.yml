name: SentriX Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile all Python
        run: python -m compileall -q .

      - name: Pure unit tests
        run: python -m pytest tests -q

      - name: Repository audit
        run: python tools/repo_audit.py

      - name: Command runtime audit
        run: python tools/command_runtime_audit.py

      - name: Command error ownership gate
        run: python tools/command_error_ownership_gate.py

      - name: Integrity gate
        run: python tools/integrity_gate.py

      - name: V2.5 quality gate
        run: python tools/v25_quality_gate.py

      - name: Permission matrix gate
        run: python tools/permission_matrix_gate.py

      - name: Natural intent fuzz gate
        run: python tools/ai_intent_fuzz_gate.py

      - name: Runtime debt gate
        run: python tools/runtime_debt_gate.py
