name: SentriX Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: "ci.fake.token"
      DATABASE_PATH: "/tmp/sentrix-integrity.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python
        run: python -m compileall -q .

      - name: Full unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Canonical architecture contracts
        run: python -m unittest tests.test_final_core_contract tests.test_easy_surface_contract -v

      - name: Repository audit
        run: python tools/repo_audit.py

      - name: Command error ownership
        run: python tools/command_error_ownership_gate.py

      - name: Permission matrix
        run: python tools/permission_matrix_gate.py

      - name: Natural intent fuzz
        run: python tools/ai_intent_fuzz_gate.py

      - name: Deferred/slash lifecycle contracts
        run: |
          python tools/slash_error_lifecycle_gate.py
          python tools/defer_send_audit.py

      - name: Integrity result
        run: echo "SentriX canonical integrity checks passed for $GITHUB_SHA"
