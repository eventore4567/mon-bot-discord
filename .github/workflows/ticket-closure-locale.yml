name: SentriX Ticket Locale

on:
  pull_request:
    paths:
      - "utils/wide_logs.py"
      - "utils/log_service.py"
      - "services/ticket_panels_v3.py"
      - "services/ticket_log_report.py"
      - "cogs/ticket_claim_security.py"
      - "tests/test_ticket_closure_locale.py"
      - ".github/workflows/ticket-closure-locale.yml"
  push:
    branches: [dashboard-refonte-2026-09]
    paths:
      - "utils/wide_logs.py"
      - "services/ticket_panels_v3.py"
      - "services/ticket_log_report.py"
      - "cogs/ticket_claim_security.py"
jobs:
  ticket-locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Python compilation
        run: python -m py_compile utils/log_service.py utils/wide_logs.py services/ticket_panels_v3.py services/ticket_log_report.py cogs/ticket_claim_security.py
      - name: Ticket language and existing audit contracts
        run: python -m pytest -q tests/test_ticket_closure_locale.py tests/test_ticket_log_cards_premium_v2.py tests/test_ticket_staff_transcript_button.py
