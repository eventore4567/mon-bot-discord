name: SentriX Final Stability Guard

on:
  push:
    branches: [main]
    paths:
      - "railway_boot.py"
      - "cogs/final_stability_guard.py"
      - "cogs/no_cooldown_final.py"
      - "cogs/logs_unified_v6.py"
      - "cogs/passive_ai_single_reply_final.py"
      - "cogs/ai_personality_final.py"
      - "tests/test_final_stability_guard.py"
      - "tests/test_passive_ai_single_reply_final.py"
      - "tests/test_ai_personality_final.py"
      - ".github/workflows/final-stability-guard.yml"
  pull_request:
    paths:
      - "railway_boot.py"
      - "cogs/final_stability_guard.py"
      - "cogs/no_cooldown_final.py"
      - "cogs/logs_unified_v6.py"
      - "cogs/passive_ai_single_reply_final.py"
      - "cogs/ai_personality_final.py"
      - "tests/test_final_stability_guard.py"
      - "tests/test_passive_ai_single_reply_final.py"
      - "tests/test_ai_personality_final.py"
      - ".github/workflows/final-stability-guard.yml"

jobs:
  final-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile guarded runtime
        run: python -m py_compile railway_boot.py cogs/final_stability_guard.py cogs/no_cooldown_final.py cogs/logs_unified_v6.py cogs/passive_ai_single_reply_final.py cogs/ai_personality_final.py
      - name: Verify final stability, single-reply and personality contracts
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-final-stability.db"
        run: PYTHONPATH=. pytest -q tests/test_final_stability_guard.py tests/test_passive_ai_single_reply_final.py tests/test_ai_personality_final.py
