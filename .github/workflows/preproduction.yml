name: SentriX Preproduction

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sentrix-preproduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Production ops tests
        run: python -m unittest tests.test_production_ops -v

      - name: Economy concurrency smoke test
        run: python tools/load_test_economy.py --users 60 --operations 800 --concurrency 20

      - name: Real command parser smoke test
        run: python tools/command_parse_smoke.py

      - name: Command contracts
        run: python tools/command_runtime_audit.py

      - name: Command error ownership
        run: python tools/command_error_ownership_gate.py

      - name: V2.5 regression gate
        run: python tools/v25_quality_gate.py

      - name: Permission matrix
        run: python tools/permission_matrix_gate.py

      - name: AI intent fuzz
        run: python tools/ai_intent_fuzz_gate.py

      - name: Runtime debt
        run: python tools/runtime_debt_gate.py

      - name: Repository audit
        run: python tools/repo_audit.py

      - name: Preproduction result
        run: echo "SentriX preproduction gates passed for $GITHUB_SHA"
