name: SentriX Log Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/guild_departure_notify.py'
      - '.github/workflows/log-runtime-diagnostic.yml'
  pull_request:
    paths:
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/guild_departure_notify.py'
      - '.github/workflows/log-runtime-diagnostic.yml'

jobs:
  log-runtime-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostic
        run: python -m py_compile cogs/log_runtime_diagnostic.py cogs/guild_departure_notify.py
      - name: Verify diagnostic contracts
        run: |
          # This gate is intentionally dependency-free: it validates the runtime probe itself.
          python - <<'PY'
          from pathlib import Path
          diag = Path('cogs/log_runtime_diagnostic.py').read_text()
          loader = Path('cogs/guild_departure_notify.py').read_text()
          assert 'name="logs-diag"' in diag
          assert '@checks.is_bot_owner()' in diag
          assert 'log_service.send_log(' in diag
          assert 'RAILWAY_SERVICE_NAME' in diag
          assert 'RAILWAY_SERVICE_ID' in diag
          assert 'RAILWAY_GIT_COMMIT_SHA' in diag
          assert 'gateway_counts' in diag
          assert 'official_attempts' in diag
          assert 'log_runtime_diagnostic.install(bot)' in loader
          print('live log diagnostic contracts OK')
          PY
