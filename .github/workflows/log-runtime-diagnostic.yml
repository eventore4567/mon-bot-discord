name: SentriX Log Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_runtime_v83.py'
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'
  pull_request:
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_runtime_v83.py'
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'

jobs:
  log-runtime-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile canonical Components V2 pipeline
        run: |
          python -m py_compile \
            utils/wide_logs.py \
            utils/embeds.py \
            utils/log_compact_final.py \
            utils/log_service.py \
            database/db.py \
            cogs/log_transport_v52.py
      # Cette garde protegeait l'architecture V83, supprimee par dbed45a quand
      # log_config est devenue l'unique source de verite du routage. Elle lisait
      # encore cogs/logs_runtime_v83.py et cogs/log_runtime_diagnostic.py, tous
      # deux effaces : le workflow echouait sur « No such file or directory »
      # sans plus rien verifier depuis ce commit.
      #
      # Reecrite sur l'invariant qui compte AUJOURD'HUI : aucun transport de
      # journalisation parallele ne peut revenir, et log_config reste le seul
      # chemin de lecture comme d'ecriture.
      - name: Verify no legacy send transport can return
        run: |
          python - <<'PY'
          from pathlib import Path

          wide = Path('utils/wide_logs.py').read_text()
          compat = Path('cogs/log_transport_v52.py').read_text()
          embeds = Path('utils/embeds.py').read_text()
          service = Path('utils/log_service.py').read_text()
          db = Path('database/db.py').read_text()

          # Les couches paralleles retirees ne doivent pas reapparaitre.
          for mort in (
              'utils/log_channel_guard.py',
              'utils/log_v2_hardening.py',
              'cogs/logs_runtime_v83.py',
              'cogs/log_runtime_diagnostic.py',
          ):
              assert not Path(mort).exists(), f'couche de journalisation ressuscitee: {mort}'

          # Aucun monkeypatch global du transport Discord.
          assert 'discord.abc.Messageable.send = _sentrix_messageable_send' not in embeds
          assert 'discord.TextChannel.send = guarded_send' not in wide
          assert 'description="SentriX"' not in wide

          # La couche de compatibilite V52 ne doit pas se reinstaller en transport.
          assert 'cog._send = types.MethodType' not in compat
          assert 'log_service.send_log = send_log_v52' not in compat

          # log_config : point d'ecriture unique, avec relecture obligatoire.
          assert 'async def set_log_config(' in service
          assert 'invalidate_log_config(' in service
          assert 'INSERT INTO log_config' in service

          # La regression corrigee par dbed45a : recreer log_settings a chaque
          # connect() ressuscitait une table vide et annulait la migration.
          assert 'LOG_SETTINGS_SCHEMA' not in db, 'log_settings ne doit plus etre recreee'
          assert 'await self._migrate_logs()' in db

          print('transport de journalisation canonique + log_config source unique OK')
          PY
