name: SentriX Log Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_runtime_v83.py'
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'
  pull_request:
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_runtime_v83.py'
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'

jobs:
  log-runtime-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile canonical Components V2 pipeline
        run: |
          python -m py_compile \
            utils/wide_logs.py \
            utils/embeds.py \
            utils/log_compact_final.py \
            utils/log_service.py \
            cogs/logs_runtime_v83.py \
            cogs/log_runtime_diagnostic.py \
            cogs/log_transport_v52.py
      - name: Verify no legacy send transport can return
        run: |
          python - <<'PY'
          from pathlib import Path

          wide = Path('utils/wide_logs.py').read_text()
          v83 = Path('cogs/logs_runtime_v83.py').read_text()
          diag = Path('cogs/log_runtime_diagnostic.py').read_text()
          compat = Path('cogs/log_transport_v52.py').read_text()
          embeds = Path('utils/embeds.py').read_text()

          assert not Path('utils/log_channel_guard.py').exists()
          assert not Path('utils/log_v2_hardening.py').exists()

          assert 'discord.TextChannel.send = guarded_send' not in v83
          assert 'discord.abc.Messageable.send = _sentrix_messageable_send' not in embeds
          assert 'SEND PATCHED = %s | qualname=%s | module=%s' in wide
          assert 'stale Logs._send instance override removed' in v83
          assert 'delattr(active_cog, "_send")' in v83
          assert 'discord.ui.Thumbnail(str(thumbnail))' in wide
          assert 'description="SentriX"' not in wide
          assert 'SENTRIX V2 PHASE A' in wide
          assert 'SENTRIX V2 PHASE B' in wide
          assert 'SENTRIX V2 PHASE C' in wide
          assert 'aucun fallback embed classique' in wide

          assert 'cog._send = types.MethodType' not in compat
          assert 'log_service.send_log = send_log_v52' not in compat

          # V83 ne doit plus capturer le wrapper V33 au moment de l'import.
          assert '_CANONICAL_SEND_LOG = log_service.send_log' not in v83
          assert 'async def _traced_canonical_send_log(' in v83
          assert 'return await _traced_canonical_send_log(' in v83
          assert 'log_service.send_log = _traced_canonical_send_log' in v83
          assert 'send_wide_log(' in v83

          # +logs-diag est un vrai embed natif et teste exactement le transport V83.
          assert 'name="logs-diag"' in diag
          assert '@checks.is_bot_owner()' in diag
          assert 'async def _native_embed_send(' in diag
          assert 'embed=panel' in diag
          assert 'logs_runtime_v83._traced_canonical_send_log(' in diag
          assert 'await ctx.send(' not in diag
          assert 'types.MethodType' not in diag
          assert '_reassert_transport' not in diag

          print('canonical Components V2 log transport + native diagnostic embed contracts OK')
          PY
