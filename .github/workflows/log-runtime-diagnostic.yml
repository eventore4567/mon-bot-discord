name: SentriX Log Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_unified_v6.py'
      - 'cogs/log_rectangle_v25.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'
  pull_request:
    paths:
      - 'utils/wide_logs.py'
      - 'utils/__init__.py'
      - 'utils/log_channel_guard.py'
      - 'utils/log_v2_hardening.py'
      - 'utils/log_compact_final.py'
      - 'utils/embeds.py'
      - 'utils/log_service.py'
      - 'cogs/logs_unified_v6.py'
      - 'cogs/log_rectangle_v25.py'
      - 'cogs/log_transport_v52.py'
      - '.github/workflows/log-runtime-diagnostic.yml'

jobs:
  log-runtime-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile canonical Components V2 pipeline
        run: |
          python -m py_compile \
            utils/wide_logs.py \
            utils/embeds.py \
            utils/log_compact_final.py \
            utils/log_service.py \
            cogs/logs_unified_v6.py \
            cogs/log_rectangle_v25.py \
            cogs/log_transport_v52.py
      - name: Verify no legacy send transport can return
        run: |
          python - <<'PY'
          from pathlib import Path

          wide = Path('utils/wide_logs.py').read_text()
          unified = Path('cogs/logs_unified_v6.py').read_text()
          rectangle = Path('cogs/log_rectangle_v25.py').read_text()
          compat = Path('cogs/log_transport_v52.py').read_text()
          service = Path('utils/log_service.py').read_text()
          embeds = Path('utils/embeds.py').read_text()
          runtime = Path('cogs/__init__.py').read_text()

          assert not Path('utils/log_channel_guard.py').exists()
          assert not Path('utils/log_v2_hardening.py').exists()
          assert not Path('cogs/logs_runtime_v83.py').exists()
          assert not Path('cogs/log_runtime_diagnostic.py').exists()

          assert 'discord.abc.Messageable.send = _sentrix_messageable_send' not in embeds
          assert 'discord.ui.Thumbnail(str(identity_icon))' in wide
          assert 'description="SentriX"' not in wide

          assert 'cog._send = types.MethodType' not in compat
          assert 'log_service.send_log = send_log_v52' not in compat
          assert 'return await log_service.send_log(' in unified
          assert 'await log_service.send_log(' in unified
          assert 'return await send_wide_log(' in service
          assert 'class RectangleLogLayout' in rectangle
          assert 'Remplace l\'ancien ``install_logs_runtime_v83``' in runtime

          print('canonical Components V2 log transport + native diagnostic embed contracts OK')
          PY
