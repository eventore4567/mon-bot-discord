name: SentriX Log Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - 'cogs/guild_departure_notify.py'
      - '.github/workflows/log-runtime-diagnostic.yml'
  pull_request:
    paths:
      - 'cogs/log_runtime_diagnostic.py'
      - 'cogs/log_transport_v52.py'
      - 'cogs/guild_departure_notify.py'
      - '.github/workflows/log-runtime-diagnostic.yml'

jobs:
  log-runtime-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostic and canonical transport
        run: python -m py_compile cogs/log_runtime_diagnostic.py cogs/log_transport_v52.py cogs/guild_departure_notify.py
      - name: Verify direct V5.3 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          diag = Path('cogs/log_runtime_diagnostic.py').read_text()
          transport = Path('cogs/log_transport_v52.py').read_text()
          loader = Path('cogs/guild_departure_notify.py').read_text()
          assert 'name="logs-diag"' in diag
          assert '@checks.is_bot_owner()' in diag
          assert 'log_transport_v52.send_log_v52(' in diag
          assert 'active_name' in diag
          assert 'last_error_message' in diag
          assert 'async def on_message(' in diag
          assert 'RAILWAY_SERVICE_NAME' in diag
          assert 'RAILWAY_SERVICE_ID' in diag
          assert 'RAILWAY_GIT_COMMIT_SHA' in diag
          assert 'async def send_log_v52(' in transport
          assert 'def _patch_logs_cog(' in transport
          assert 'cog._send = types.MethodType(direct_logs_send, cog)' in transport
          assert 'return await send_log_v52(' in transport
          assert 'log_service.send_log = send_log_v52' in transport
          assert '_unwrap_messageable_send' in transport
          assert 'log_service._is_duplicate' in transport
          assert 'LOG_ALLOWED_MENTIONS' in transport
          assert 'log_transport_v52.install(bot)' in loader
          assert loader.index('log_transport_v52.install(bot)') < loader.index('log_runtime_diagnostic.install(bot)')
          print('live log diagnostic + direct V5.3 listener transport contracts OK')
          PY
