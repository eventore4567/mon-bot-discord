name: Platform P1 Verification

on:
  push:
    branches: [chatgpt/platform-p1-complete]
    paths:
      - ".github/workflows/platform-p1-verify.yml"
      - "tools/platform_p0/**"
      - "tools/platform_p1/**"
  workflow_dispatch:

concurrency:
  group: platform-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-python-gate:
    name: P1 Python + PostgreSQL Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/sentrix_test
      MIGRATIONS_DATABASE_URL: postgresql://sentrix_migrator:migrator_dev_only@localhost:5432/sentrix_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentrix_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils systeme
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client unzip
      - name: Reconstruire P0 puis appliquer P1
        run: |
          set -euo pipefail
          rm -rf /tmp/platform-src
          mkdir -p /tmp/platform-src
          cat \
            tools/platform_p0/bundle.part01.b64 \
            tools/platform_p0/bundle.part02.b64 \
            tools/platform_p0/bundle.part03.b64 \
            tools/platform_p0/bundle.part04.b64 \
            tools/platform_p0/bundle.part05.b64 \
            tools/platform_p0/bundle.part06.b64 \
            tools/platform_p0/bundle.part07a.b64 \
            tools/platform_p0/bundle.part07b.b64 \
            tools/platform_p0/bundle.part08.b64 \
            tools/platform_p0/bundle.part09.b64 \
            tools/platform_p0/bundle.part10a.b64 \
            tools/platform_p0/bundle.part10b.b64 \
            | base64 --decode > /tmp/sentrix-platform-p0.zip
          unzip -t /tmp/sentrix-platform-p0.zip
          unzip -q /tmp/sentrix-platform-p0.zip -d /tmp/platform-src
          cat tools/platform_p1/overlay.part*.b64 | base64 --decode > /tmp/sentrix-platform-p1-overlay.zip
          unzip -t /tmp/sentrix-platform-p1-overlay.zip
          unzip -oq /tmp/sentrix-platform-p1-overlay.zip -d /tmp/platform-src/sentrix-platform
          cat tools/platform_p1/hotfix01.part*.b64 | base64 --decode > /tmp/sentrix-platform-p1-hotfix.zip
          unzip -t /tmp/sentrix-platform-p1-hotfix.zip
          unzip -oq /tmp/sentrix-platform-p1-hotfix.zip -d /tmp/platform-src/sentrix-platform
          test -f /tmp/platform-src/sentrix-platform/agents/node_agent/main.py
          chmod +x /tmp/platform-src/sentrix-platform/ops/ci/*.sh /tmp/platform-src/sentrix-platform/ops/execution/*.sh
      - name: Installer les dependances
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Creer les roles et permissions schema
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f ops/bootstrap/roles.sql
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -c "GRANT CREATE, USAGE ON SCHEMA public TO sentrix_migrator;" \
            -c "GRANT USAGE ON SCHEMA public TO sentrix_app;"
      - name: Prouver que sentrix_app ne contourne pas RLS
        run: |
          result=$(psql "$SUPERUSER_URL" -tAc \
            "SELECT rolbypassrls OR rolsuper FROM pg_roles WHERE rolname='sentrix_app'")
          echo "sentrix_app privileged=$result"
          test "$result" = "f"
      - name: Appliquer les migrations P0 + P1
        working-directory: /tmp/platform-src/sentrix-platform
        run: python -m libs.db.migrate
      - name: Verifier l'idempotence des migrations
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          output=$(python -m libs.db.migrate)
          echo "$output"
          echo "$output" | grep -q "deja a jour"
      - name: Regression P0 - 12 attaques cross-tenant
        working-directory: /tmp/platform-src/sentrix-platform
        run: pytest tests/security -v -m security --tb=short --strict-markers
      - name: P1 unitaires + integration DB
        working-directory: /tmp/platform-src/sentrix-platform
        run: pytest tests/unit tests/integration -v --tb=short
      - name: Ruff strict
        working-directory: /tmp/platform-src/sentrix-platform
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy strict
        working-directory: /tmp/platform-src/sentrix-platform
        run: mypy libs services agents

  p1-runtime-gate:
    name: P1 gVisor + Chaos + Isolation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruire P0 puis appliquer P1
        run: |
          set -euo pipefail
          rm -rf /tmp/platform-src
          mkdir -p /tmp/platform-src
          cat \
            tools/platform_p0/bundle.part01.b64 \
            tools/platform_p0/bundle.part02.b64 \
            tools/platform_p0/bundle.part03.b64 \
            tools/platform_p0/bundle.part04.b64 \
            tools/platform_p0/bundle.part05.b64 \
            tools/platform_p0/bundle.part06.b64 \
            tools/platform_p0/bundle.part07a.b64 \
            tools/platform_p0/bundle.part07b.b64 \
            tools/platform_p0/bundle.part08.b64 \
            tools/platform_p0/bundle.part09.b64 \
            tools/platform_p0/bundle.part10a.b64 \
            tools/platform_p0/bundle.part10b.b64 \
            | base64 --decode > /tmp/sentrix-platform-p0.zip
          unzip -q /tmp/sentrix-platform-p0.zip -d /tmp/platform-src
          cat tools/platform_p1/overlay.part*.b64 | base64 --decode > /tmp/sentrix-platform-p1-overlay.zip
          unzip -oq /tmp/sentrix-platform-p1-overlay.zip -d /tmp/platform-src/sentrix-platform
          cat tools/platform_p1/hotfix01.part*.b64 | base64 --decode > /tmp/sentrix-platform-p1-hotfix.zip
          unzip -oq /tmp/sentrix-platform-p1-hotfix.zip -d /tmp/platform-src/sentrix-platform
          chmod +x /tmp/platform-src/sentrix-platform/ops/ci/*.sh /tmp/platform-src/sentrix-platform/ops/execution/*.sh
      - name: Installer les dependances Python minimales
        working-directory: /tmp/platform-src/sentrix-platform
        run: pip install -e .
      - name: Installer et verifier gVisor runsc
        working-directory: /tmp/platform-src/sentrix-platform
        run: sudo ./ops/execution/install-gvisor.sh
      - name: Verifier Docker runtime runsc
        run: |
          docker info
          docker run --rm --runtime=runsc alpine:3.20 uname -a
      - name: Test probant P1b - CP coupe + kill -9 + relance cache
        working-directory: /tmp/platform-src/sentrix-platform
        run: sudo -E env PATH="$PATH" PYTHONPATH="$PWD" ./ops/ci/p1-chaos.sh
      - name: Test probant P1c - isolation reseau + quotas
        working-directory: /tmp/platform-src/sentrix-platform
        run: sudo -E env PATH="$PATH" PYTHONPATH="$PWD" ./ops/ci/p1-isolation.sh
