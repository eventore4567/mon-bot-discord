name: SentriX Quiet Dashboard Motion V29

on:
  pull_request:
    paths:
      - 'web/dashboard_quiet_motion_v29.py'
      - 'web/dashboard_native_bundle_v14.py'
      - 'web/dashboard_motion_system_v25.py'
      - 'web/dashboard_visible_motion_v26.py'
      - 'web/dashboard_motion_audio_v27.py'
      - 'tests/test_dashboard_quiet_motion_v29.py'
      - '.github/workflows/dashboard-quiet-motion-v29.yml'
  push:
    branches:
      - dashboard-refonte-2026-09
    paths:
      - 'web/dashboard_quiet_motion_v29.py'
      - 'web/dashboard_native_bundle_v14.py'
      - 'web/dashboard_motion_system_v25.py'
      - 'web/dashboard_visible_motion_v26.py'
      - 'web/dashboard_motion_audio_v27.py'
      - 'tests/test_dashboard_quiet_motion_v29.py'

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DISCORD_TOKEN: ci.fake.token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate Python
        run: python -m py_compile web/dashboard_quiet_motion_v29.py web/dashboard_native_bundle_v14.py web/dashboard_motion_system_v25.py web/dashboard_visible_motion_v26.py web/dashboard_motion_audio_v27.py
      - name: Test no duplicate animations
        run: python -m pytest -q tests/test_dashboard_quiet_motion_v29.py tests/test_dashboard_native_motion_v28.py tests/test_dashboard_motion_audio_v27.py
