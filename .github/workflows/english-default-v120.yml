name: English default language

on:
  pull_request:
    paths:
      - "cogs/language_runtime.py"
      - "cogs/help_complete_v79.py"
      - "cogs/guild_arrival.py"
      - "cogs/public_language_choice.py"
      - "tests/test_english_default_language_v120.py"
      - ".github/workflows/english-default-v120.yml"
  workflow_dispatch:

jobs:
  english-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile localization
        run: python -m py_compile cogs/language_runtime.py cogs/help_complete_v79.py cogs/public_language_choice.py cogs/guild_arrival.py
      - name: Test localization
        env:
          DISCORD_TOKEN: "ci-placeholder-not-a-real-token"
        run: python -m pytest -q tests/test_english_default_language_v120.py
