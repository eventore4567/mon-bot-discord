name: SentriX Bot V10

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bot-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Bot V10
        run: >-
          python -m compileall -q
          cogs/bot_v10.py
          web/platform_v10.py
          tools/bot_v10_audit.py

      - name: Bot V10 regression gate
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-bot-v10.db"
        run: python tools/bot_v10_audit.py
