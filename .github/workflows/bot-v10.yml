name: SentriX Bot V10
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bot-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m compileall -q cogs/bot_v10.py web/platform_v10.py tools/v10_compile_gate.py
      - run: python tools/v10_compile_gate.py
        env:
          DISCORD_TOKEN: "ci.fake.token"
          DATABASE_PATH: "/tmp/sentrix-bot-v10.db"
