name: SentriX Command Sweep

# Exécute TOUTES les commandes (préfixe + slash) sur le bot booté comme en production,
# avec des arguments générés depuis les signatures réelles (tools/command_sweep.py).
# Rouge dès qu'une commande produit une erreur technique (référence SXR) ; les commandes
# « fragiles » restent informatives dans le rapport publié en artefact.

on:
  push:
    branches: [main, "dashboard-refonte-*"]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: sentrix-command-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sweep tooling
        run: python -m py_compile tools/command_sweep.py tools/sentrix_e2e_harness.py tools/permission_audit_sweep.py cogs/command_health.py

      - name: Critical runtime regression tests
        env:
          DISCORD_TOKEN: "ci.fake.token"
          OPENAI_API_KEY: ""
          POSTGRES_URL: ""
          REDIS_URL: ""
        run: |
          python -m pytest -q \
            tests/test_games_runtime_core.py \
            tests/test_ai_command_router.py \
            tests/test_automod_live_matrix.py \
            tests/test_ticket_atomic_actions.py \
            tests/test_ticket_rating_persistence.py \
            tests/test_economy_race_conditions.py \
            tests/test_services_economy.py \
            tests/test_services_tickets.py \
            tests/test_access_matrix.py \
            tests/test_giveaway_center.py \
            tests/test_ha_transition_observability.py \
            tests/test_ha_sigterm_failover.py \
            tests/test_dashboard_auth_visible.py \
            tests/test_public_home_v1.py \
            tests/test_public_home_v2.py \
            tests/test_public_home_v3.py \
            tests/test_public_home_runtime_route.py

      - name: Sweep every command (strict on technical errors)
        env:
          DISCORD_TOKEN: "ci.fake.token"
          OPENAI_API_KEY: ""
          POSTGRES_URL: ""
          REDIS_URL: ""
        run: python tools/command_sweep.py --strict --out reports/command_sweep

      - name: Audit permissions × messages de refus (strict)
        env:
          DISCORD_TOKEN: "ci.fake.token"
          OPENAI_API_KEY: ""
          POSTGRES_URL: ""
          REDIS_URL: ""
          SENTRIX_SHORT_SLASH_NAMES: "1"
        run: python tools/permission_audit_sweep.py --strict --out reports/permission_audit

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-sweep-report
          path: |
            reports/command_sweep.*
            reports/permission_audit.*
          if-no-files-found: warn
