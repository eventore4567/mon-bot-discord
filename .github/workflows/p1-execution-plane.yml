name: SentriX P1 Execution Plane Gate

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/p1-full-20260810
    paths:
      - p1_gate/**
      - .github/workflows/p1-execution-plane.yml

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit proofs
        working-directory: p1_gate
        run: python test_unit.py
      - name: Compile
        run: python -m py_compile p1_gate/node_agent.py p1_gate/test_unit.py

  real-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor runsc
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          curl -fsSL "$URL/runsc" -o runsc
          curl -fsSL "$URL/runsc.sha512" -o runsc.sha512
          sha512sum -c runsc.sha512
          chmod a+rx runsc
          sudo mv runsc /usr/local/bin/runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep runsc
          runsc --version
      - name: Prove sandbox isolation and quotas
        run: bash p1_gate/verify_isolation.sh
