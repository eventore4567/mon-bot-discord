name: SentriX Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sentrix-uptime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HEALTH_URL: https://mon-bot-discord-production-8944.up.railway.app/health
      INCIDENT_TITLE: "[SentriX] Incident uptime production"
    steps:
      - name: Check SentriX from outside Railway
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -f /tmp/sentrix-health.json
          for attempt in 1 2 3 4; do
            code=$(curl --connect-timeout 8 --max-time 15 -sS -o /tmp/sentrix-health.json -w "%{http_code}" "$HEALTH_URL")
            python - "$code" <<'PY'
          import json, pathlib, sys
          code = sys.argv[1]
          path = pathlib.Path('/tmp/sentrix-health.json')
          try:
              data = json.loads(path.read_text())
          except Exception:
              data = {}
          ok = code == '200' and bool(data.get('discord_ready')) and bool(data.get('database_ok', True))
          print(f"HTTP={code} discord_ready={data.get('discord_ready')} database_ok={data.get('database_ok')}")
          raise SystemExit(0 if ok else 1)
          PY
            if [ $? -eq 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "SentriX n'est pas sain après 4 tentatives."
          cat /tmp/sentrix-health.json 2>/dev/null || true
          exit 1

      - name: Open one incident issue on failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          title = os.environ['INCIDENT_TITLE']
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          req = urllib.request.Request(base + "/issues?state=open&per_page=100", headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              issues = json.load(response)
          if any(item.get('title') == title for item in issues):
              print('Incident déjà ouvert.')
          else:
              body = json.dumps({"title": title, "body": "Le contrôle externe GitHub n'a pas obtenu un état Discord/base sain après 4 tentatives. Vérifier Railway et les logs SentriX."}).encode()
              req = urllib.request.Request(base + "/issues", data=body, method="POST", headers={**headers, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  print('Incident créé:', json.load(response).get('html_url'))
          PY

      - name: Close uptime incident after recovery
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          title = os.environ['INCIDENT_TITLE']
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          req = urllib.request.Request(base + "/issues?state=open&per_page=100", headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              issues = json.load(response)
          for item in issues:
              if item.get('title') != title:
                  continue
              body = json.dumps({"state": "closed", "state_reason": "completed", "body": item.get('body', '') + "\n\nRécupération détectée automatiquement par le moniteur externe."}).encode()
              req = urllib.request.Request(base + f"/issues/{item['number']}", data=body, method="PATCH", headers={**headers, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=20):
                  print('Incident fermé après récupération.')
              break
          PY
