name: SentriX Member History UI

on:
  pull_request:
    branches: [dashboard-refonte-2026-09]
    paths:
      - 'cogs/log_history_center.py'
      - 'tests/test_member_history_readability.py'
      - '.github/workflows/sentrix-member-history-ui.yml'
  workflow_dispatch:

jobs:
  member-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci.fake.token
      DATABASE_PATH: /tmp/sentrix-member-history-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Validate Python module
        run: python -m py_compile cogs/log_history_center.py tests/test_member_history_readability.py
      - name: Test native Discord panels and paging
        run: python -m pytest -q tests/test_member_history_readability.py
