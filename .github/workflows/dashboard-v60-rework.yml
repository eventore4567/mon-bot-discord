name: Dashboard V60 SentriX rework

on:
  push:
    branches:
      - rework/dashboard-v60-sentrix
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'tests/test_dashboard_browser_program_v56.py'
      - 'tests/test_dashboard_v60_rework.py'
      - 'tests/dump_dashboard_prestart_v56.py'
      - 'tests/dashboard_v56_browser_smoke.mjs'
      - '.github/workflows/dashboard-v60-rework.yml'

jobs:
  browser-program:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DISCORD_TOKEN: static-ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.txt
      - name: Install browser smoke dependency
        run: npm install --no-save jsdom@26
      - name: Check the exact pre-start browser program
        run: python -m pytest -q tests/test_dashboard_browser_program_v56.py tests/test_dashboard_v60_rework.py
      - name: Build the exact pre-start dashboard
        run: python tests/dump_dashboard_prestart_v56.py /tmp/sentrix-app.html
      - name: Execute the dashboard bootstrap in a DOM
        run: node tests/dashboard_v56_browser_smoke.mjs /tmp/sentrix-app.html
