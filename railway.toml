[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install ./sentrix-platform"

[deploy]
startCommand = "cd sentrix-platform && uvicorn services.companion.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/healthz"
healthcheckTimeout = 20
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
